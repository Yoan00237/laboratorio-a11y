<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratorio A11Y · Sesión 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --fondo: #141915;
  --tarjeta: #232A24;
  --bloque: #181D19;
  --borde-suave: #333B35;
  --borde-control: #76807A;
  --texto: #F1F5F2;
  --texto-secundario: #ABB4AD;
  --neutra-marcada: #D3DAD5;
  --bloqueado: #8F9992;
  --acento: #4DD13C;
  --acento-claro: #BDF4B3;
  --acento-oscuro: #1C3A1A;
  --advertencia-borde: #C9973A;
  --advertencia-fondo: #3A2E14;
  --advertencia-titulo: #FFD38A;
  --error-borde: #D9534F;
  --error-fondo: #3A1D22;
  --error-titulo: #FF9E9E;
  --voiceover-fondo: #2E2140;
  --voiceover-texto: #E4D2FF;
  --texto-sobre-acento: #141915;
  --lienzo: #FFFFFF;
  --lienzo-texto: #16202B;
  --material-texto-secundario: #55606E;
  --material-borde: #767676;
  --material-linea: #CDD5DF;
  --material-accion: #0E6A6A;
  --material-accion-hover: #0B5555;
  --material-accion-presionado: #083F3F;
  --material-enlace: #0057B8;
  --material-deshabilitado-fondo: #F5F5F5;
  --material-deshabilitado-texto: #707070;
  --material-advertencia-fondo: #FCEFD6;
  --material-advertencia: #8A5300;
  --material-error-fondo: #FBE3E1;
  --material-error: #B3261E;
  --material-exito-fondo: #DDF2E5;
  --material-exito: #1A7340;
  --material-anotacion: #6B35A0;
  --material-anotacion-fondo: #F5EEFB;
  --espacio-4: 4px;
  --espacio-8: 8px;
  --espacio-12: 12px;
  --espacio-16: 16px;
  --espacio-24: 24px;
  --espacio-32: 32px;
  --radio-control: 8px;
  --radio-contenedor: 12px;
  --radio-pildora: 999px;
  --profundidad-principal: 0 4px 0 0 #1c3a1a;
  --profundidad-secundaria: 0 4px 0 0 #333b35;
  --profundidad-positiva: 0 4px 0 0 #4dd13c;
  --profundidad-neutra: 0 4px 0 0 #76807a;
  --material-profundidad-principal: 0 4px 0 0 rgba(0, 0, 0, 0.35);
  --material-profundidad-secundaria: 0 4px 0 0 #cdd5df;
  --quiebre-tablet: 600px;
  --quiebre-desktop: 1024px;
  --columnas-movil: 4;
  --columnas-tablet: 8;
  --columnas-desktop: 12;
  --medianil-movil: 16px;
  --medianil-tablet: 24px;
  --medianil-desktop: 24px;
  --margen-movil: 16px;
  --margen-tablet: 32px;
  --margen-desktop: 32px;
  --ancho-maximo: 1240px;
  --font-sans: Inter, "Helvetica Neue", Helvetica, sans-serif;
  color-scheme: dark;
}
/* Laboratorio A11Y · estilos de componentes. Cargar después de tokens.css. Fuente: Inter (Google Fonts). */
.lab, .lab * { box-sizing: border-box; }
.lab { font-family: var(--font-sans, Inter, "Helvetica Neue", Helvetica, sans-serif); color: var(--texto); background: var(--fondo); font-size: 14px; line-height: 1.5; }
.lab :focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }

/* Barra de cabecera: único degradado permitido, decorativo */
.lab-barra { height: 4px; background: linear-gradient(90deg, var(--acento-oscuro), var(--acento), var(--acento-claro)); }

/* Botones con profundidad */
.lab-btn { font-family: inherit; font-size: 16px; font-weight: 600; line-height: 1.25; min-height: 44px; padding: 0 var(--espacio-24); border-radius: var(--radio-control); border: 1px solid transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: var(--espacio-8); transition: transform .08s ease, box-shadow .08s ease; }
.lab-btn--principal { background: var(--acento); color: var(--texto-sobre-acento); box-shadow: var(--profundidad-principal); }
.lab-btn--secundario { background: transparent; color: var(--texto); border-color: var(--borde-control); box-shadow: var(--profundidad-secundaria); }
.lab-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: none; }
.lab-btn--texto { background: transparent; border-color: transparent; color: var(--texto-secundario); font-weight: 500; padding: 0 var(--espacio-12); box-shadow: none; }
.lab-btn--texto:hover { color: var(--texto); }
.lab-btn:disabled { background: transparent; color: var(--bloqueado); border: 1px dashed var(--borde-control); box-shadow: none; cursor: not-allowed; }

/* Tarjetas de opción */
.lab-opciones { display: grid; gap: var(--espacio-12); }
.lab-opcion { font-family: inherit; font-size: 14px; font-weight: 600; line-height: 1.25; width: 100%; min-height: 56px; padding: var(--espacio-12) var(--espacio-16); display: flex; align-items: center; gap: var(--espacio-12); text-align: left; border-radius: var(--radio-control); border: 2px solid var(--borde-control); background: transparent; color: var(--texto); box-shadow: var(--profundidad-secundaria); cursor: pointer; transition: transform .08s ease, box-shadow .08s ease; }
.lab-opcion:hover { background: var(--tarjeta); }
.lab-opcion:active { transform: translateY(4px); box-shadow: none; }
.lab-opcion .tecla { flex: none; display: inline-grid; place-items: center; width: 28px; height: 28px; border: 1px solid var(--borde-control); border-radius: var(--radio-control); font-size: 13px; font-weight: 500; color: var(--texto-secundario); }
.lab-opcion[aria-checked="true"], .lab-opcion[aria-pressed="true"] { border-color: var(--acento); background: var(--acento-oscuro); color: var(--acento-claro); box-shadow: var(--profundidad-positiva); }
.lab-opcion[aria-checked="true"] .tecla, .lab-opcion[aria-pressed="true"] .tecla { border-color: var(--acento); color: var(--acento-claro); }
.lab-opcion--neutra[aria-checked="true"], .lab-opcion--neutra[aria-pressed="true"] { border-color: var(--neutra-marcada); background: var(--neutra-marcada); color: var(--texto-sobre-acento); box-shadow: var(--profundidad-neutra); }
.lab-opcion--neutra[aria-checked="true"] .tecla { border-color: var(--fondo); color: var(--fondo); }

/* Etiquetas */
.lab-etiqueta { display: inline-flex; align-items: center; gap: var(--espacio-4); font-size: 13px; font-weight: 500; line-height: 1.25; padding: var(--espacio-4) var(--espacio-8); border-radius: var(--radio-pildora); background: var(--borde-suave); color: var(--texto); border: 1px solid var(--borde-suave); }
.lab-etiqueta--verde { background: var(--acento-oscuro); border-color: var(--acento); color: var(--acento-claro); }
.lab-etiqueta--ambar { background: var(--advertencia-fondo); border-color: var(--advertencia-borde); color: var(--advertencia-titulo); }
.lab-etiqueta--teclado { font-weight: 700; background: var(--acento-oscuro); border-color: var(--acento-oscuro); color: var(--acento-claro); padding: var(--espacio-4) var(--espacio-12) var(--espacio-4) 10px; }
.lab-etiqueta--voiceover { font-weight: 700; background: var(--voiceover-fondo); border-color: var(--voiceover-fondo); color: var(--voiceover-texto); padding: var(--espacio-4) var(--espacio-12) var(--espacio-4) 10px; }
.lab-etiqueta--respuestas { font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: var(--acento-oscuro); border-color: var(--acento-oscuro); color: var(--acento-claro); padding: var(--espacio-4) var(--espacio-12) var(--espacio-4) 10px; }
.lab-etiqueta--teclado svg, .lab-etiqueta--voiceover svg { width: 16px; height: 16px; }

/* Barra de progreso de la etapa: línea fina con rótulo */
.lab-progreso { display: grid; gap: var(--espacio-12); }
.lab-progreso .rotulo { display: flex; justify-content: space-between; gap: var(--espacio-12); font-size: 13px; font-weight: 500; color: var(--texto-secundario); }
.lab-progreso .riel { height: 4px; border-radius: var(--radio-pildora); background: var(--borde-suave); overflow: hidden; }
.lab-progreso .lleno { height: 100%; border-radius: var(--radio-pildora); background: var(--neutra-marcada); }

/* Cronómetro: texto con ícono, sin recuadro */
.lab-crono { display: inline-flex; align-items: center; gap: var(--espacio-8); font-size: 15px; font-weight: 600; line-height: 1.25; color: var(--texto-secundario); font-variant-numeric: tabular-nums; }
.lab-crono svg { width: 18px; height: 18px; flex: none; }
.lab-crono--poco { color: var(--error-titulo); }

/* Alertas */
.lab-alerta { display: grid; gap: var(--espacio-4); padding: var(--espacio-12) var(--espacio-16); border-radius: var(--radio-contenedor); border: 1px solid; }
.lab-alerta .titulo { font-size: 14px; font-weight: 700; line-height: 1.25; }
.lab-alerta .detalle { font-size: 14px; line-height: 1.5; color: var(--texto); }
.lab-alerta--exito { border-color: var(--acento); background: var(--acento-oscuro); } .lab-alerta--exito .titulo { color: var(--acento-claro); }
.lab-alerta--advertencia { border-color: var(--advertencia-borde); background: var(--advertencia-fondo); } .lab-alerta--advertencia .titulo { color: var(--advertencia-titulo); }
.lab-alerta--error { border-color: var(--error-borde); background: var(--error-fondo); } .lab-alerta--error .titulo { color: var(--error-titulo); }

/* Franja de resultado */
.lab-franja { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--espacio-16); padding: var(--espacio-16) var(--espacio-24); border-top: 2px solid; }
.lab-franja .titulo { font-size: 18px; font-weight: 700; line-height: 1.3; }
.lab-franja .detalle { font-size: 14px; color: var(--texto); }
.lab-franja--acierto { background: var(--acento-oscuro); border-color: var(--acento); } .lab-franja--acierto .titulo { color: var(--acento-claro); }
.lab-franja--error { background: var(--error-fondo); border-color: var(--error-borde); } .lab-franja--error .titulo { color: var(--error-titulo); }

/* Pestañas */
.lab-pestanas { display: flex; border-bottom: 1px solid var(--borde-suave); }
.lab-pestana { font-family: inherit; font-size: 16px; font-weight: 600; line-height: 1.25; min-height: 48px; padding: 0 var(--espacio-16); background: transparent; border: 0; border-bottom: 3px solid transparent; color: var(--texto-secundario); cursor: pointer; }
.lab-pestana:hover { background: var(--tarjeta); }
.lab-pestanas--chicas { gap: var(--espacio-16); }
.lab-pestanas--chicas .lab-pestana { font-size: 14px; font-weight: 500; min-height: 0; padding: var(--espacio-8) 2px 6px; margin-bottom: -1px; }
.lab-pestanas--chicas .lab-pestana[aria-selected="true"] { font-weight: 700; }
.lab-pestana:active { background: var(--bloque); }
.lab-pestana[aria-selected="true"] { color: var(--texto); font-weight: 700; border-bottom-color: var(--acento); }
.lab-pestana:disabled { color: var(--bloqueado); cursor: not-allowed; }

/* Campo de texto */
.lab-campo { display: grid; gap: var(--espacio-8); }
.lab-campo label { font-size: 14px; font-weight: 600; }
.lab-campo input, .lab-campo textarea { font-family: inherit; font-size: 16px; font-weight: 400; line-height: 1.25; min-height: 44px; padding: 0 var(--espacio-16); border-radius: var(--radio-control); border: 1px solid var(--borde-control); background: transparent; color: var(--texto); }
.lab-campo textarea { padding: var(--espacio-12) var(--espacio-16); min-height: 96px; resize: vertical; }
.lab-campo input:hover, .lab-campo input:focus, .lab-campo textarea:hover, .lab-campo textarea:focus { border-color: var(--acento); }
.lab-campo input::placeholder, .lab-campo textarea::placeholder { color: var(--texto-secundario); }
.lab-campo .aviso { font-size: 14px; color: var(--texto-secundario); }
.lab-campo--error input { border-color: var(--error-borde); }
.lab-campo--error .aviso { color: var(--error-titulo); }

/* Tarjeta */
.lab-tarjeta { border-radius: var(--radio-contenedor); border: 1px solid var(--borde-suave); background: var(--tarjeta); }
.lab-tarjeta .cabecera { min-height: 56px; padding: var(--espacio-12) var(--espacio-16); display: flex; align-items: center; justify-content: space-between; gap: var(--espacio-12); border-bottom: 1px solid var(--borde-suave); font-size: 16px; font-weight: 700; }
.lab-tarjeta .cuerpo { padding: var(--espacio-16); display: grid; gap: var(--espacio-12); }

/* Lienzo: mesa de trabajo blanca de cada ejercicio */
.lab-lienzo { border-radius: var(--radio-contenedor); border: 1px solid var(--borde-suave); background: var(--lienzo); color: var(--lienzo-texto); padding: var(--espacio-16); color-scheme: light; }

@media (prefers-reduced-motion: reduce) { .lab-btn, .lab-opcion { transition: none; } .lab-btn:active:not(:disabled), .lab-opcion:active { transform: none; } }

/* ===== Estados forzados para documentar (is-hover, is-focus, is-active) ===== */
.lab-btn--principal:hover:not(:disabled), .lab-btn--principal.is-hover { background: var(--acento-claro); }
.lab-btn--secundario:hover:not(:disabled), .lab-btn--secundario.is-hover { background: var(--tarjeta); }
.lab-btn.is-focus, .lab-opcion.is-focus, .lab-pestana.is-focus, .lab-alternar.is-focus, .lab-muestra.is-focus { outline: 2px solid var(--acento); outline-offset: 2px; }
.lab-btn.is-active { transform: translateY(4px); box-shadow: none; }
.lab-btn svg, .lab-alternar svg { width: 20px; height: 20px; flex: none; }
.lab-btn--icono { width: 44px; padding: 0; }
.lab-opcion.is-hover { background: var(--tarjeta); }
.lab-opcion.is-active { transform: translateY(4px); box-shadow: none; }
.lab-opcion:disabled { border-style: dashed; color: var(--bloqueado); box-shadow: none; cursor: not-allowed; }
.lab-pestana.is-hover { background: var(--tarjeta); }
.lab-pestana.is-active { background: var(--bloque); }
.lab-campo input.is-hover, .lab-campo input.is-focus { border-color: var(--acento); }
.lab-campo input.is-focus { outline: 2px solid var(--acento); outline-offset: 2px; }
.lab-campo input:disabled { border-style: dashed; color: var(--bloqueado); }
.lab-campo--fijo input { border-style: dashed; }
.lab-rotulo { font-size: 13px; font-weight: 500; color: var(--texto-secundario); }
.lab-matriz { display: grid; grid-template-columns: max-content repeat(5, max-content); gap: var(--espacio-12) var(--espacio-16); align-items: center; }

/* Botón alternar (aria-pressed) */
.lab-alternar { font-family: inherit; font-size: 14px; font-weight: 600; min-height: 36px; padding: 0 var(--espacio-12); display: inline-flex; align-items: center; gap: var(--espacio-8); border-radius: var(--radio-control); border: 1px solid var(--borde-control); background: transparent; color: var(--texto); cursor: pointer; }
.lab-alternar:hover, .lab-alternar.is-hover { background: var(--tarjeta); }
.lab-alternar[aria-pressed="true"] { border: 2px solid var(--acento); background: var(--acento-oscuro); color: var(--acento-claro); }
.lab-alternar:disabled { border-style: dashed; color: var(--bloqueado); cursor: not-allowed; }


/* Muestras de color (escalas) */
.lab-muestras { display: flex; flex-wrap: wrap; gap: var(--espacio-4); }
.lab-muestra { width: 32px; height: 32px; border-radius: var(--radio-control); border: 1px solid var(--borde-suave); cursor: pointer; padding: 0; }
.lab-muestra[aria-checked="true"] { box-shadow: 0 0 0 2px var(--fondo), 0 0 0 4px var(--texto); }
.lab-muestra--ninguna { background: repeating-linear-gradient(45deg, var(--tarjeta) 0 4px, var(--borde-suave) 4px 8px); }
.lab-muestra-elegida { font-size: 13px; color: var(--texto-secundario); font-variant-numeric: tabular-nums; }

/* Íconos dentro de alertas, etiquetas y franja */
.lab-alerta { grid-template-columns: 20px minmax(0, 1fr); column-gap: var(--espacio-12); align-items: start; }
.lab-alerta > svg { grid-row: span 2; width: 20px; height: 20px; margin-top: 1px; }
.lab-alerta--exito > svg { color: var(--acento-claro); } .lab-alerta--advertencia > svg { color: var(--advertencia-titulo); } .lab-alerta--error > svg { color: var(--error-titulo); }
.lab-alerta--info { border-color: var(--borde-control); background: var(--bloque); } .lab-alerta--info .titulo, .lab-alerta--info > svg { color: var(--texto); }
.lab-alerta--pista { border-color: var(--advertencia-borde); background: var(--advertencia-fondo); } .lab-alerta--pista .titulo, .lab-alerta--pista > svg { color: var(--advertencia-titulo); }
.lab-etiqueta svg { width: 14px; height: 14px; }
.lab-franja .icono { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: var(--radio-pildora); }
.lab-franja--acierto .icono { background: var(--acento); color: var(--fondo); }
.lab-franja--error .icono { background: var(--error-titulo); color: var(--fondo); }
.lab-franja .texto { display: flex; align-items: center; gap: var(--espacio-12); }

/* Avatar personalizado (DiceBear): círculo con fondo claro en listas, podio y resultado */
.lab-avatar { width: 40px; height: 40px; display: block; flex: none; border-radius: var(--radio-pildora); }
.lab-participantes { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: var(--espacio-8); }
.lab-participante { display: flex; align-items: center; gap: var(--espacio-8); padding: var(--espacio-8) var(--espacio-12); border-radius: var(--radio-control); border: 1px solid var(--borde-suave); font-size: 14px; font-weight: 600; min-width: 0; }
.lab-participante--yo { border-color: var(--acento); }

/* Tabla */
.lab-tabla { width: 100%; border-collapse: collapse; font-size: 14px; }
.lab-tabla th { text-align: left; font-size: 13px; font-weight: 600; color: var(--texto-secundario); padding: var(--espacio-8) var(--espacio-12); border-bottom: 1px solid var(--borde-suave); }
.lab-tabla td { padding: var(--espacio-12); border-bottom: 1px solid var(--borde-suave); vertical-align: top; }
.lab-tabla .num { text-align: right; font-variant-numeric: tabular-nums; }
.lab-resultado { display: inline-flex; align-items: center; gap: var(--espacio-4); font-weight: 600; white-space: nowrap; }
.lab-resultado svg { width: 16px; height: 16px; }
.lab-resultado--si { color: var(--acento-claro); } .lab-resultado--no { color: var(--error-titulo); } .lab-resultado--neutro { color: var(--texto-secundario); }

/* Podio */
.lab-podio { display: flex; justify-content: center; align-items: flex-end; gap: var(--espacio-12); }
.lab-podio .puesto { width: 120px; display: grid; justify-items: center; gap: var(--espacio-8); text-align: center; }
.lab-podio .nombre { font-size: 14px; font-weight: 700; }
.lab-podio .base { width: 100%; border-radius: var(--radio-contenedor) var(--radio-contenedor) 0 0; border: 1px solid var(--borde-suave); background: var(--tarjeta); display: grid; place-items: center; font-size: 22px; font-weight: 700; }
.lab-podio .p1 .base { height: 120px; border: 2px solid var(--acento); background: var(--acento-oscuro); color: var(--acento-claro); }
.lab-podio .p2 .base { height: 88px; } .lab-podio .p3 .base { height: 64px; }
.lab-podio .base small { display: block; font-size: 13px; font-weight: 500; color: var(--texto-secundario); }

/* Confirmación */
.lab-confirmacion { border-radius: var(--radio-contenedor); border: 1px solid var(--borde-control); background: var(--bloque); padding: var(--espacio-16); display: grid; gap: var(--espacio-12); }
.lab-confirmacion .titulo { font-size: 16px; font-weight: 700; }
.lab-confirmacion .acciones { display: flex; flex-wrap: wrap; gap: var(--espacio-8); }

/* Íconos */
.lab-iconos { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: var(--espacio-8); }
.lab-iconos figure { margin: 0; display: grid; justify-items: center; gap: var(--espacio-4); padding: var(--espacio-12) var(--espacio-4); border: 1px solid var(--borde-suave); border-radius: var(--radio-control); font-size: 13px; color: var(--texto-secundario); }
.lab-iconos svg { width: 24px; height: 24px; color: var(--texto); }

/* ===== Material de ejercicios: dentro de .lab-lienzo =====
   Mismos patrones que la plataforma (Inter, alto de 44 px, radio 8 y 12, profundidad de 4 px, borde punteado al desactivar), en versión clara
   porque el lienzo es blanco: los contrastes de los ejercicios se miden contra #FFFFFF. */
.mat { font-family: var(--font-sans, Inter, "Helvetica Neue", Helvetica, sans-serif); color: var(--lienzo-texto); font-size: 14px; line-height: 1.5; }
.mat :focus-visible, .mat .is-focus { outline: 2px solid var(--material-accion); outline-offset: 2px; }
.mat-rotulo { font-size: 13px; font-weight: 500; color: var(--material-texto-secundario); }
/* Botón (igual que Boton) */
.mat-btn { font-family: inherit; font-size: 16px; font-weight: 600; line-height: 1.25; min-height: 44px; padding: 0 24px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 8px; border: 1px solid transparent; background: var(--material-accion); color: #FFFFFF; box-shadow: var(--material-profundidad-principal); cursor: pointer; transition: transform .08s ease, box-shadow .08s ease; }
.mat-btn svg { width: 20px; height: 20px; flex: none; }
.mat-btn:hover, .mat-btn.is-hover { background: var(--material-accion-hover); }
.mat-btn:active, .mat-btn.is-active { transform: translateY(4px); box-shadow: none; }
.mat-btn--secundario, .mat-btn--icono { background: var(--lienzo); color: var(--lienzo-texto); border-color: var(--material-borde); box-shadow: var(--material-profundidad-secundaria); }
.mat-btn--secundario:hover, .mat-btn--secundario.is-hover, .mat-btn--icono:hover, .mat-btn--icono.is-hover { background: #F3F4F6; }
.mat-btn--icono { width: 44px; padding: 0; }
.mat-btn[aria-pressed="true"] { border: 2px solid var(--material-accion); background: #E3F1F1; color: var(--material-accion-presionado); box-shadow: 0 4px 0 0 var(--material-accion); }
.mat-btn:disabled { background: transparent; color: var(--material-deshabilitado-texto); border: 1px dashed var(--material-borde); box-shadow: none; transform: none; cursor: not-allowed; }
/* Tag (igual que Etiqueta) */
.mat-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 500; line-height: 1.25; padding: 4px 8px; border-radius: 999px; border: 1px solid currentColor; background: var(--material-exito-fondo); color: var(--material-exito); }
.mat-tag--neutra { background: #F3F4F6; color: var(--lienzo-texto); border-color: var(--material-linea); }
.mat-tag--advertencia { background: var(--material-advertencia-fondo); color: var(--material-advertencia); }
/* Tooltip: burbuja sobre el ícono que la abre (hover o foco). --tooltip-fondo permite cambiar el color en los ejercicios. */
.mat-tip { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
.mat-tip-ancla { position: relative; display: inline-flex; }
.mat-tooltip { --tooltip-fondo: var(--lienzo-texto); position: absolute; left: 0; bottom: calc(100% + 12px); z-index: 2; width: max-content; max-width: 240px; background: var(--tooltip-fondo); color: #FFFFFF; font-size: 13px; font-weight: 500; line-height: 1.35; padding: 8px 12px; border-radius: 8px; }
.mat-tooltip::after { content: ""; position: absolute; left: 16px; top: 100%; border: 6px solid transparent; border-top-color: var(--tooltip-fondo); }
.mat-tip-ancla:not(.is-abierto) .mat-tooltip { display: none; }
.mat-tip-ancla:hover .mat-tooltip, .mat-tip-ancla:focus-within .mat-tooltip { display: block; }
/* Cita */
.mat-cita { margin: 0; position: relative; padding: 16px 16px 16px 56px; border-radius: 12px; border: 1px solid var(--material-linea); background: #F3F4F6; color: var(--material-texto-secundario); }
.mat-cita::before { content: "\201C"; position: absolute; left: 16px; top: 8px; font: 700 52px/1 Georgia, "Times New Roman", serif; color: currentColor; }
.mat-cita blockquote { margin: 0; font-size: 16px; font-style: italic; line-height: 1.45; }
.mat-cita figcaption { margin-top: 8px; font-size: 14px; }
/* Card (igual que Tarjeta; la seleccionable, igual que BotonOpcion) */
.mat-card { border-radius: 12px; border: 1px solid var(--material-linea); background: var(--lienzo); padding: 16px; display: grid; gap: 4px; font-size: 14px; }
.mat-card b { font-size: 16px; font-weight: 700; }
.mat-card--sombra { border-color: transparent; box-shadow: 0 6px 16px rgba(0, 0, 0, .18); }
.mat-card--seleccionable { border: 2px solid var(--material-borde); box-shadow: var(--material-profundidad-secundaria); cursor: pointer; }
.mat-card--seleccionable[aria-checked="true"] { border-color: var(--material-accion); background: #E3F1F1; box-shadow: 0 4px 0 0 var(--material-accion); }
.mat-card--deshabilitada { background: var(--material-deshabilitado-fondo); color: var(--material-deshabilitado-texto); border: 1px dashed var(--material-borde); }
.mat-card--deshabilitada .mat-btn:disabled { color: inherit; }
/* Campo (igual que CampoTexto) */
.mat-campo { display: grid; gap: 8px; }
.mat-campo label { font-size: 14px; font-weight: 600; }
.mat-campo input { font-family: inherit; font-size: 16px; line-height: 1.25; min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--material-borde); background: var(--lienzo); color: var(--lienzo-texto); width: 100%; }
.mat-campo input::placeholder { color: var(--material-texto-secundario); }
.mat-campo input:hover, .mat-campo input.is-hover, .mat-campo input:focus, .mat-campo input.is-focus { border-color: var(--material-accion); }
.mat-campo input:disabled { background: transparent; color: var(--material-deshabilitado-texto); border-style: dashed; }
.mat-campo--error input { border-color: var(--material-error); }
.mat-campo .error { display: flex; gap: 8px; align-items: flex-start; color: var(--material-error); font-size: 14px; }
.mat-campo .error svg { width: 18px; height: 18px; flex: none; margin-top: 2px; }
/* Controles */
.mat-check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
.mat-check .caja { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--material-borde); display: grid; place-items: center; background: var(--lienzo); }
.mat-check[aria-checked="true"] .caja { background: var(--material-accion); border-color: var(--material-accion); color: #FFFFFF; }
.mat-check[aria-disabled="true"] { color: var(--material-deshabilitado-texto); } .mat-check[aria-disabled="true"] .caja { border-style: dashed; background: transparent; }
.mat-toggle { display: inline-flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
button.mat-toggle { background: none; border: 0; padding: 0; font-family: inherit; color: inherit; text-align: left; min-height: 44px; }
.mat-toggle .riel { width: 52px; height: 32px; border-radius: 999px; background: var(--material-borde); position: relative; flex: none; }
.mat-toggle .riel::after { content: ""; position: absolute; left: 4px; top: 4px; width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; transition: left .12s ease; }
.mat-toggle[aria-checked="true"] .riel { background: var(--material-accion); } .mat-toggle[aria-checked="true"] .riel::after { left: 24px; }
.mat-toggle[aria-disabled="true"] { color: var(--material-deshabilitado-texto); } .mat-toggle[aria-disabled="true"] .riel { background: transparent; border: 1px dashed var(--material-borde); }
/* Acordeón */
.mat-acordeon { border: 1px solid var(--material-linea); border-radius: 12px; }
.mat-acordeon .cabecera { display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 48px; padding: 12px 16px; font: inherit; font-size: 16px; font-weight: 700; background: none; border: 0; color: inherit; cursor: pointer; }
.mat-acordeon .cabecera svg { width: 20px; height: 20px; transition: transform .15s; }
.mat-acordeon .cabecera[aria-expanded="true"] svg { transform: rotate(180deg); }
.mat-acordeon .panel { padding: 0 16px 16px; color: var(--material-texto-secundario); }
/* Alerta (igual que Alerta) */
.mat-alerta { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: 12px; border: 1px solid; font-size: 14px; }
.mat-alerta > svg { width: 20px; height: 20px; flex: none; margin-top: 1px; }
.mat-alerta .texto { flex: 1; }
.mat-alerta--advertencia { background: var(--material-advertencia-fondo); border-color: var(--material-advertencia); } .mat-alerta--advertencia > svg { color: var(--material-advertencia); }
.mat-alerta--error { background: var(--material-error-fondo); border-color: var(--material-error); } .mat-alerta--error > svg { color: var(--material-error); }
.mat-alerta--exito { background: var(--material-exito-fondo); border-color: var(--material-exito); } .mat-alerta--exito > svg { color: var(--material-exito); }
.mat-alerta .cerrar { background: none; border: 0; padding: 2px; color: var(--lienzo-texto); cursor: pointer; display: grid; } .mat-alerta .cerrar svg { width: 18px; height: 18px; }
/* Selector y enlace */
.mat-selector { display: grid; gap: 8px; position: relative; max-width: 320px; }
.mat-selector label { font-size: 14px; font-weight: 600; }
.mat-selector select { appearance: none; font-family: inherit; font-size: 16px; min-height: 44px; padding: 0 44px 0 16px; border-radius: 8px; border: 1px solid var(--material-borde); background: var(--lienzo); color: var(--lienzo-texto); }
.mat-selector .flecha { position: absolute; right: 12px; bottom: 12px; pointer-events: none; width: 20px; height: 20px; }
.mat-enlace { color: var(--material-enlace); text-decoration: underline; display: inline-flex; align-items: center; gap: 4px; }
.mat-enlace svg { width: 16px; height: 16px; }
@media (prefers-reduced-motion: reduce) { .mat-btn, .mat-toggle .riel::after { transition: none; } .mat-btn:active { transform: none; } }

/* Pasos: dividen un ejercicio en partes (estaciones, misiones o preguntas) que se recorren en cualquier orden */
.lab-pasos { display: flex; flex-wrap: wrap; gap: var(--espacio-8); list-style: none; margin: 0; padding: 0; }
.lab-paso { font-family: inherit; font-size: 14px; font-weight: 500; line-height: 1.25; min-height: 40px; padding: 6px 14px 6px 6px; display: inline-flex; align-items: center; gap: var(--espacio-8); border: 1px solid var(--borde-control); border-radius: var(--radio-pildora); background: transparent; color: var(--texto-secundario); cursor: pointer; }
.lab-paso .num { flex: none; display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: var(--radio-pildora); background: var(--borde-suave); color: var(--texto); font-size: 13px; }
.lab-paso .num svg { width: 15px; height: 15px; }
.lab-paso:hover, .lab-paso.is-hover { background: var(--bloque); }
.lab-paso.is-focus { outline: 2px solid var(--acento); outline-offset: 2px; }
.lab-paso[aria-current="step"] { border: 2px solid var(--texto); padding: 5px 13px 5px 5px; color: var(--texto); font-weight: 600; }
.lab-paso[aria-current="step"] .num { background: var(--texto); color: var(--fondo); }
.lab-paso--hecho .num { background: var(--acento-oscuro); color: var(--acento-claro); }
.lab-paso--mouse { color: var(--error-titulo); }
.lab-paso--mouse .num { background: var(--error-fondo); color: var(--error-titulo); }

/* Para llevar: la regla del ejercicio en una línea, en la pantalla de resultado */
.lab-llevar { display: flex; gap: var(--espacio-16); align-items: flex-start; padding: var(--espacio-16) var(--espacio-24); border-radius: var(--radio-contenedor); border: 1px solid var(--borde-suave); background: var(--tarjeta); }
.lab-llevar .icono { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: var(--radio-pildora); border: 2px solid var(--advertencia-borde); background: var(--advertencia-fondo); color: var(--advertencia-titulo); }
.lab-llevar .icono svg { width: 22px; height: 22px; }
.lab-llevar .titulo { font-size: 14px; font-weight: 700; color: var(--advertencia-titulo); }
.lab-llevar p { margin: 0; font-size: 16px; line-height: 1.5; max-width: 72ch; }
/* ===== Sesión 2 ===== */
/* Tecla dibujada: la tecla de cada estación y las teclas disponibles */
.lab-tecla { display: flex; align-items: center; justify-content: center; height: 64px; padding: 0 var(--espacio-24); border: 1px solid var(--borde-control); border-bottom-width: 6px; border-radius: var(--radio-control); background: var(--bloque); color: var(--texto); font-size: 20px; font-weight: 600; }
.lab-teclas { display: flex; flex-wrap: wrap; gap: var(--espacio-8); }
.lab-tecla--chica { display: inline-flex; height: 36px; padding: 0 var(--espacio-12); border-bottom-width: 4px; font-size: 13px; }
/* Interruptor (role="switch") */
.lab-interruptor { display: flex; justify-content: space-between; align-items: center; gap: var(--espacio-12); border: 1px solid var(--borde-suave); border-radius: var(--radio-control); padding: var(--espacio-12) 14px; font-size: 15px; font-weight: 600; }
.lab-interruptor [role="switch"] { width: 48px; height: 28px; flex: none; border-radius: var(--radio-pildora); border: 2px solid var(--borde-control); background: transparent; padding: 0 3px; display: flex; align-items: center; cursor: pointer; }
.lab-interruptor [role="switch"] span { width: 18px; height: 18px; border-radius: var(--radio-pildora); background: var(--texto-secundario); }
.lab-interruptor [role="switch"][aria-checked="true"] { border-color: var(--acento); background: var(--acento-oscuro); justify-content: flex-end; }
.lab-interruptor [role="switch"][aria-checked="true"] span { background: var(--acento); }
/* Verificación: estado de una tarea que la plataforma comprueba sola */
.lab-verificacion { border: 1px solid var(--borde-suave); border-radius: var(--radio-contenedor); background: var(--bloque); padding: var(--espacio-16); display: grid; gap: 10px; }
.lab-verificacion .estado { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; color: var(--texto); }
.lab-verificacion .marca { width: 22px; height: 22px; border-radius: var(--radio-pildora); border: 2px dashed var(--borde-control); display: grid; place-items: center; }
.lab-verificacion--cumplida { border-color: var(--acento); background: var(--acento-oscuro); }
.lab-verificacion--cumplida .estado { color: var(--acento-claro); }
.lab-verificacion--cumplida .marca { border: 0; background: var(--acento); color: var(--fondo); }
.lab-verificacion p { margin: 0; color: var(--texto-secundario); }
/* Progreso de tareas: un círculo numerado por tarea */
.lab-tareas { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: var(--espacio-8); }
.lab-tareas li span { width: 30px; height: 30px; border-radius: var(--radio-pildora); display: grid; place-items: center; font-size: 13px; border: 1px solid var(--borde-control); color: var(--texto-secundario); }
.lab-tareas .hecha span { background: var(--acento-oscuro); border-color: var(--acento-oscuro); color: var(--acento-claro); }
.lab-tareas .actual span { background: var(--texto); border: 2px solid var(--texto); color: var(--fondo); font-weight: 700; }
/* Sesiones del programa: información, no controles */
.lab-sesiones { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--espacio-8); }
.lab-sesion { display: flex; align-items: center; gap: var(--espacio-12); border-radius: var(--radio-contenedor); padding: var(--espacio-12) var(--espacio-16); border: 1px dashed var(--borde-control); }
.lab-sesion .num { flex: none; width: 28px; height: 28px; border-radius: var(--radio-pildora); display: grid; place-items: center; background: var(--borde-suave); color: var(--texto); font-size: 13px; font-weight: 700; }
.lab-sesion .num svg { width: 14px; height: 14px; }
.lab-sesion .datos { flex: 1; min-width: 0; display: grid; gap: 2px; }
.lab-sesion .cuando { font-size: 13px; font-weight: 500; color: var(--texto-secundario); }
.lab-sesion .nombre { font-weight: 600; color: var(--texto-secundario); }
.lab-sesion--hoy { border: 2px solid var(--acento); background: var(--acento-oscuro); }
.lab-sesion--hoy .num { background: var(--acento); color: var(--fondo); }
.lab-sesion--hoy .nombre { color: var(--texto); }
/* Editor de avatar */
.lab-editor { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 20px; align-items: start; }
.lab-editor .vista { background: var(--bloque); border: 1px solid var(--borde-suave); border-radius: var(--radio-contenedor); padding: var(--espacio-12); display: grid; place-items: center; }
.lab-editor .vista img { width: 176px; height: 176px; display: block; }
.lab-editor fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.lab-editor legend { font-size: 13px; font-weight: 600; color: var(--texto-secundario); padding: 0; margin-bottom: 6px; }
.lab-editor .grilla { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.lab-editor .op { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 2px; border-radius: var(--radio-control); border: 1px solid var(--borde-suave); font-size: 12px; font-weight: 500; color: var(--texto-secundario); text-align: center; line-height: 1.2; cursor: pointer; min-width: 0; }
.lab-editor .op input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.lab-editor .op img { width: 40px; height: 40px; display: block; }
.lab-editor .op:hover { background: var(--bloque); }
.lab-editor .op:has(input:checked) { border: 2px solid var(--acento); background: var(--acento-oscuro); color: var(--acento-claro); }
.lab-editor .op:has(input:focus-visible) { outline: 2px solid var(--acento); outline-offset: 2px; }
.lab-colores { display: flex; flex-wrap: wrap; gap: 6px; }
.lab-color { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: var(--radio-pildora); border: 1px solid var(--borde-suave); font-size: 13px; font-weight: 500; color: var(--texto); cursor: pointer; }
.lab-color input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.lab-color .muestra { width: 20px; height: 20px; border-radius: var(--radio-pildora); border: 1px solid rgba(255,255,255,.35); }
.lab-color:has(input:checked) { border: 2px solid var(--acento); background: var(--acento-oscuro); color: var(--acento-claro); }
/* Etapas del facilitador */
.lab-etapas { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--espacio-24); }
.lab-etapa { border: 1px solid var(--borde-suave); background: var(--tarjeta); border-radius: var(--radio-contenedor); padding: var(--espacio-12) var(--espacio-16); display: grid; gap: var(--espacio-4); }
.lab-etapa .estado { color: var(--texto-secundario); }
.lab-etapa--curso { border: 2px solid var(--acento); background: var(--acento-oscuro); }
.lab-etapa--curso .estado { color: var(--acento-claro); }
/* Usos del mouse: solo en la vista del facilitador */
.lab-mouse { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; color: var(--texto-secundario); }
.lab-mouse svg { width: 16px; height: 16px; }
.lab-mouse--usado { font-weight: 600; color: var(--advertencia-titulo); }

/* ===== Plataforma · Sesión 2 ===== */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--fondo); color: var(--texto); font-family: var(--font-sans); font-size: 14px; line-height: 1.5; }
img, svg { max-width: 100%; }
[hidden] { display: none !important; }
p { margin: 0; }
button, input, select, textarea { font-family: inherit; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }
h1 { font-size: 22px; font-weight: 700; line-height: 1.3; margin: 0; text-wrap: balance; }
h2 { font-size: 18px; font-weight: 700; line-height: 1.3; margin: 0; }
h3 { font-size: 16px; font-weight: 700; margin: 0; }

/* Barra superior y contenedor */
.topbar { background: var(--bloque); border-bottom: 1px solid var(--borde-suave); }
.topbar-in, .contenedor { max-width: var(--ancho-maximo); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar-in { padding-block: 14px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: var(--espacio-12); }
@media (min-width: 600px) { .topbar-in, .contenedor { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }
.brand { display: flex; align-items: baseline; gap: var(--espacio-12); flex-wrap: wrap; }
.brand-name { font-size: 18px; font-weight: 700; }
.brand-sub { font-size: 13px; font-weight: 500; color: var(--texto-secundario); }
.yo { display: flex; align-items: center; gap: var(--espacio-8); font-weight: 600; }
.yo .lab-avatar { width: 30px; height: 30px; }
.pill { display: inline-flex; align-items: center; gap: var(--espacio-4); font-size: 13px; font-weight: 500; padding: var(--espacio-4) 10px; border-radius: var(--radio-pildora); background: var(--acento-oscuro); border: 1px solid var(--acento); color: var(--acento-claro); white-space: nowrap; }
.avisos-globales { display: grid; gap: var(--espacio-12); }
.avisos-globales:has(> :not([hidden])) { padding-top: var(--espacio-16); }
.vista { padding-block: var(--espacio-32) 48px; display: grid; gap: var(--espacio-24); align-content: start; }
.grilla { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: 16px; row-gap: var(--espacio-24); align-items: start; }
.grilla > * { grid-column: 1 / -1; min-width: 0; }
@media (min-width: 600px) { .grilla { grid-template-columns: repeat(8, minmax(0, 1fr)); column-gap: 24px; } }
@media (min-width: 1024px) {
  .grilla { grid-template-columns: repeat(12, minmax(0, 1fr)); }
  .grilla > .d-3 { grid-column: auto / span 3; } .grilla > .d-4 { grid-column: auto / span 4; } .grilla > .d-5 { grid-column: auto / span 5; }
  .grilla > .d-7 { grid-column: auto / span 7; } .grilla > .d-8 { grid-column: auto / span 8; } .grilla > .d-9 { grid-column: auto / span 9; }
}
.cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.cab > div { display: grid; gap: var(--espacio-8); }
.eyebrow { font-size: 13px; font-weight: 500; color: var(--texto-secundario); }
.lede { color: var(--texto-secundario); max-width: 520px; }
.panel { background: var(--tarjeta); border: 1px solid var(--borde-suave); border-radius: var(--radio-contenedor); padding: var(--espacio-24); display: grid; gap: var(--espacio-16); min-width: 0; align-content: start; }
.fila { display: flex; flex-wrap: wrap; gap: var(--espacio-12); align-items: center; }
.nota { color: var(--texto-secundario); font-size: 14px; }
.msg { color: var(--error-titulo); font-size: 14px; }
.msg:empty { display: none; }
.input { font-size: 16px; min-height: 44px; padding: 0 var(--espacio-16); border-radius: var(--radio-control); border: 1px solid var(--borde-control); background: transparent; color: var(--texto); width: 100%; }

  const t = $("#timer"), tx = $("#timer-txt"); if (t && tx) { tx.textContent = (rest <= 60 ? "Queda " : "Tiempo ") + mmss(rest); t.classList.toggle("lab-crono--poco", rest <= 60); }

  if (rest > 60) ej.avisado = false;

/* Menú desplegable con el patrón de teclado estándar (se usa en varios ejercicios) */
function menu(c, boton, lista, { alCerrarEsc, alSalirTab, alElegir } = {}) {
  const items = () => $$('[role="menuitem"]', lista);
  let conTeclado = false;
  const flecha = boton.querySelector("[aria-hidden]");
  const abrir = (teclado, ultimo) => { lista.hidden = false; boton.setAttribute("aria-expanded", "true"); if (flecha) flecha.textContent = "▴"; conTeclado = teclado; const it = items(); (ultimo ? it[it.length - 1] : it[0]).focus(); };
  const cerrar = foco => { lista.hidden = true; boton.setAttribute("aria-expanded", "false"); if (flecha) flecha.textContent = "▾"; if (foco) boton.focus(); };
  boton.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " " || e.key === "ArrowDown") { e.preventDefault(); abrir(true); }
    else if (e.key === "ArrowUp") { e.preventDefault(); abrir(true, true); }
  });
  boton.addEventListener("click", e => { if (e.detail === 0) return; lista.hidden ? abrir(false) : cerrar(true); });
  lista.addEventListener("keydown", e => {
    const it = items(), i = it.indexOf(document.activeElement);
    if (e.key === "ArrowDown") { e.preventDefault(); it[(i + 1) % it.length].focus(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); it[(i + it.length - 1) % it.length].focus(); }
    else if (e.key === "Home") { e.preventDefault(); it[0].focus(); }
    else if (e.key === "End") { e.preventDefault(); it[it.length - 1].focus(); }
    else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); cerrar(true); if (alCerrarEsc) alCerrarEsc(conTeclado); }
    else if (e.key === "Tab") { cerrar(false); if (alSalirTab) alSalirTab(); }
    else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); const el = it[i]; cerrar(true); if (alElegir) alElegir(el, true); }
  });
  lista.addEventListener("click", e => { const el = e.target.closest('[role="menuitem"]'); if (!el) return; cerrar(true); if (alElegir) alElegir(el, false); });
  return { abrir, cerrar };
}

  V().innerHTML = `<main class="contenedor vista" id="contenido" tabindex="-1"><div class="cab"><div><span class="eyebrow">Fin de la sesión</span><h1>Tu resultado final</h1></div></div>
    <div class="grilla">
      <section class="panel d-4 final-yo">${avatarImg(yo.avatar, 56)}<b>${esc(yo.nombre)}</b><span class="puesto">Puesto ${pos || "–"} de ${rk.length || 1}</span><span class="nota">${total} de 100 puntos<br>El puesto se actualiza mientras los demás terminan</span></section>
      <section class="panel ${podio ? "d-5" : "d-8"}"><h2>Puntaje por etapa</h2><div class="tabla-wrap"><table class="lab-tabla"><thead><tr><th scope="col">Etapa</th><th scope="col" class="num">Puntos</th></tr></thead><tbody>${ETAPAS.map(e => `<tr><td>${e.nombre}</td><td class="num">${etapaPts(p, e.n)} de ${e.max}</td></tr>`).join("")}<tr class="total"><td>Total</td><td class="num">${total} de 100</td></tr></tbody></table></div></section>
      ${podio}</div></main>`;
  if (foco && $("#" + foco)) $("#" + foco).focus();
}

function claveVista() {
  if (!yo) return "inicio";
  if (resultado) return "resultado:" + resultado.def.id;
  if (sala && sala.ranking && hecho("rf")) return "final";
  const etapa = (sala && sala.etapa) || 0;
  if (etapa === 0) return "espera:0";
  if (ej && ej.def.etapa < etapa && !hecho(ej.def.id)) return "ej:" + ej.def.id;
  const pend = ejDeEtapa(etapa).find(e => !hecho(e.id)); if (pend) return "ej:" + pend.id;
  if (etapa === 3 || (sala && sala.ranking)) return "final";
  return "espera:" + etapa;
}
function actualizar(forzar) {
  pintarYo();
  if (PROTO) { if (protoVista === "espera") refrescarEspera(); return; }
  if (ES_FACILITADOR) { vistaFacilitador(); return; }
  if (!actualizar.gente) return;
  const k = claveVista();
  if (k === vistaKey && !forzar) {
    if (k.startsWith("espera")) refrescarEspera();
    if (k === "final") vistaFinal();
    if (k.startsWith("ej:")) aplicarExtension();
    return;
  }
  if (k === vistaKey && forzar && k.startsWith("ej:")) return;
  vistaKey = k;
  if (ej && !k.startsWith("ej:")) { clearInterval(ej.timer); ej = null; }
  if (k === "inicio") vistaInicio();
  else if (k.startsWith("resultado")) vistaResultado();
  else if (k === "final") vistaFinal();
  else if (k.startsWith("ej:")) iniciarEjercicio(EJ.find(e => e.id === k.slice(3)));
  else {
    const n = +k.split(":")[1];
    if (n === 0) vistaEspera("Esperando el inicio", "El facilitador iniciará la sesión en unos momentos. Mientras tanto, mira quiénes ya entraron.");
    else { const sig = ETAPAS.find(e => e.n === n + 1); vistaEspera(`Terminaste ${ETAPAS.find(e => e.n === n).nombre}`, `Buen trabajo. Escucha la explicación del facilitador; ${sig ? (sig.n === 3 ? "el Recorrido final empezará" : `la etapa ${sig.nombre} empezará`) : "la siguiente etapa empezará"} cuando la inicie.`); }
  }
  if (!k.startsWith("ej:")) enfocarTitulo();
}

function reconocimientos(rk) {
  const out = [];
  [1, 2].forEach(n => { const best = [...rk].filter(p => etapaPts(p, n) > 0).sort((a, b) => etapaPts(b, n) - etapaPts(a, n) || tiempoDe(a) - tiempoDe(b))[0]; if (best) out.push([`Mejor en ${ETAPAS[n - 1].nombre}`, best.nombre]); });
  const maxEj = Math.max(0, ...rk.map(p => Object.keys(p.puntajes || {}).length));
  const rap = rk.filter(p => maxEj && Object.keys(p.puntajes || {}).length === maxEj).sort((a, b) => a.t - b.t)[0];
  if (rap) out.push(["Más rápido", rap.nombre]);
  return out;
}
function vistaProyeccion(rk) {

    <section class="panel"><h2>Reconocimientos</h2><div class="recos">${reconocimientos(rk).map(([k, v]) => `<div class="reco"><span class="k">${k}</span><b>${esc(v)}</b></div>`).join("") || '<p class="nota">Aparecen cuando hay puntajes.</p>'}</div></section>
    <p class="nota" style="text-align:center">Cada persona ve su puesto y su puntaje en su propio dispositivo.</p></main>`;

function descargarCSV() {
  const rk = ranking();
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const cab = ["Puesto", "Nombre", "Avatar", "Total", ...ETAPAS.map(e => e.nombre), "Usos del mouse (Teclado)", ...EJ.flatMap(e => [`${e.titulo} · puntos`, `${e.titulo} · tiempo (s)`, `${e.titulo} · aciertos`, `${e.titulo} · usos del mouse`, `${e.titulo} · respuestas y teclas`])];
  const filas = rk.map((p, i) => [i + 1, p.nombre, avatarDescripcion(p.avatar), p.total, ...ETAPAS.map(e => etapaPts(p, e.n)), mouseDe(p), ...EJ.flatMap(e => { const x = (p.puntajes || {})[e.id] || {}; return [x.pts ?? "", x.tiempo ?? "", x.aciertos ?? "", ((p.mouse || {})[e.id]) ?? (x.mouse ?? ""), x.respuestas ?? ""]; })]);
  const csv = "﻿" + [cab, ...filas].map(r => r.map(q).join(";")).join("\r\n");
  const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a"); a.href = url; a.download = `laboratorio-a11y-${SALA}-${new Date().toISOString().slice(0, 10)}.csv`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  const m = $("#fac-msg"); if (m) m.textContent = "Descargaste los datos de la sesión.";
}

function protoIr(k) {
  if (ej) { clearInterval(ej.timer); ej = null; }
  resultado = null; protoVista = k; $("#proto-sel").value = k;
  if (k === "inicio") vistaInicio();
  else if (k === "eres") { vistaInicio({ nombre: "Joan", avatar: PROTO_GENTE[0][1] }); vistaInicio.mostrarEresTu({ id: "proto-0", nombre: "Joan", avatar: PROTO_GENTE[0][1], puntajes: { t1: { pts: 9 } } }); return; }

}
async function protoIniciar() {
  await store.borrarParticipantes();

    await store.setParticipante("proto-" + i, { nombre, avatar, creado: i, puntajes, mouse: { t1: mouse } });
  }

  const sel = $("#proto-sel");

  protoIr(PROTO_P.some(x => x[0] === ini) ? ini : "inicio");
}

/* ---- 99-arranque.js ---- */
/* ============ Arranque ============ */
(async function () {
  V().innerHTML = '<main class="contenedor vista"><p class="nota">Cargando la sala…</p></main>';
  store = await crearStore();
  if (PROTO) {
    const refac = () => { if (protoVista === "facilitador" && !fac.proyeccion) vistaFacilitador(); };
    store.watchSala(s => { sala = s || sala; refac(); });
    store.watchParticipantes(a => { gente = a; actualizar(false); refac(); });
    await protoIniciar(); return;
  }
  store.watchSala(s => {
    sala = s || { etapa: 0 };
    if (!s && ES_FACILITADOR && fac.ok) store.setSala({ etapa: 0, ranking: false, extension: 0, creada: Date.now() });
    actualizar(false);
  });
  store.watchParticipantes(a => {
    gente = a; actualizar.gente = true;
    // si la sala se reinició y mi registro ya no existe, vuelvo al inicio
    if (!ES_FACILITADOR && yo && !gente.find(p => p.id === yo.pid) && actualizar.visto) { yo = null; lsDel(LKEY); local.hechos = {}; resultado = null; if (ej) { clearInterval(ej.timer); ej = null; } vistaKey = ""; }
    if (yo && gente.find(p => p.id === yo.pid)) actualizar.visto = true;
    if (yo && yo.avatar) yo.avatar = normAvatar(yo.avatar);
    actualizar(false);
  });
})();
