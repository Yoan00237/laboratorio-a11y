<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laboratorio A11Y</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Laboratorio A11Y · sistema de diseño (Widget Checklist A11y v2.4.0 + adiciones de la plataforma). Solo modo oscuro. */
:root {
  --fondo: #141915; --tarjeta: #232A24; --bloque: #181D19; --borde-suave: #333B35; --borde-control: #76807A;
  --texto: #F1F5F2; --texto-secundario: #ABB4AD; --neutra-marcada: #D3DAD5; --bloqueado: #8F9992;
  --acento: #4DD13C; --acento-claro: #BDF4B3; --acento-oscuro: #1C3A1A;
  --adv-borde: #C9973A; --adv-fondo: #3A2E14; --adv-titulo: #FFD38A;
  --err-borde: #D9534F; --err-fondo: #3A1D22; --err-titulo: #FF9E9E;
  --lienzo: #FFFFFF; --lienzo-texto: #16202B;
  --e4: 4px; --e8: 8px; --e12: 12px; --e16: 16px; --e24: 24px; --e32: 32px;
  --r-control: 8px; --r-contenedor: 12px; --r-pildora: 999px;
  --font: Inter, "Helvetica Neue", Helvetica, sans-serif;
  /* alias usados por el código de los ejercicios */
  --bg: var(--fondo); --surface: var(--tarjeta); --fg: var(--texto); --muted: var(--texto-secundario); --line: var(--borde-suave);
  --accent: var(--acento); --accent-ink: var(--fondo); --accent-soft: var(--acento-oscuro);
  --ok: var(--acento-claro); --ok-soft: var(--acento-oscuro); --bad: var(--err-titulo); --bad-soft: var(--err-fondo);
  --warn: var(--adv-borde); --warn-soft: var(--adv-fondo);
  --font-display: var(--font); --font-body: var(--font); --font-mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--fondo); color: var(--texto); font-family: var(--font); font-size: 14px; line-height: 1.5; }
img, svg { max-width: 100%; }
[hidden] { display: none !important; }
p { margin: 0; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }
.skip { position: absolute; left: -9999px; top: 8px; background: var(--acento); color: var(--fondo); font-weight: 600; padding: 8px 16px; border-radius: var(--r-control); z-index: 30; }
.skip:focus { left: 16px; }

/* Barra de cabecera y barra superior */
.barra { height: 4px; background: linear-gradient(90deg, var(--acento-oscuro), var(--acento), var(--acento-claro)); }
.topbar { background: var(--bloque); border-bottom: 1px solid var(--borde-suave); }
.topbar-in { max-width: 1240px; margin: 0 auto; padding-block: var(--e12); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: var(--e8) var(--e24); }
.brand { display: flex; align-items: baseline; gap: var(--e12); flex-wrap: wrap; }
.brand-name { font-size: 18px; font-weight: 700; }
.brand-sub { font-size: 13px; font-weight: 500; color: var(--texto-secundario); }
.yo { display: flex; align-items: center; gap: var(--e8); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: var(--e4); font-size: 13px; font-weight: 500; padding: var(--e4) var(--e8); border-radius: var(--r-pildora); background: var(--acento-oscuro); border: 1px solid var(--acento); color: var(--acento-claro); font-variant-numeric: tabular-nums; }

main { max-width: 1240px; margin: 0 auto; padding-block: var(--e32) 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: var(--e24); }
/* Grilla del design system: 4 columnas en móvil, 8 en tablet (600 px) y 12 en desktop (1024 px) */
@media (min-width: 600px) { main, .topbar-in { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }
.grilla { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: 16px; row-gap: var(--e24); align-items: start; }
.grilla > * { grid-column: 1 / -1; min-width: 0; }
.grilla > .m-2 { grid-column: auto / span 2; }
@media (min-width: 600px) {
  .grilla { grid-template-columns: repeat(8, minmax(0, 1fr)); column-gap: 24px; }
  .grilla > .t-3 { grid-column: auto / span 3; } .grilla > .t-4 { grid-column: auto / span 4; } .grilla > .t-5 { grid-column: auto / span 5; } .grilla > .t-8 { grid-column: auto / span 8; }
  .grilla > .t-desde-5 { grid-column-start: 5; }
}
@media (min-width: 1024px) {
  .grilla { grid-template-columns: repeat(12, minmax(0, 1fr)); }
  .grilla > .d-3 { grid-column: auto / span 3; } .grilla > .d-4 { grid-column: auto / span 4; } .grilla > .d-5 { grid-column: auto / span 5; } .grilla > .d-6 { grid-column: auto / span 6; }
  .grilla > .d-7 { grid-column: auto / span 7; } .grilla > .d-8 { grid-column: auto / span 8; } .grilla > .d-12 { grid-column: auto / span 12; }
  .grilla > .d-desde-10 { grid-column-start: 10; }
}
.eyebrow { font-size: 13px; font-weight: 500; color: var(--texto-secundario); }
.etq { display: inline-flex; align-items: center; font-size: 13px; font-weight: 500; padding: var(--e4) var(--e8); border-radius: var(--r-pildora); background: var(--borde-suave); color: var(--texto); }
h1 { font-size: 22px; font-weight: 700; line-height: 1.3; margin: 0; text-wrap: balance; }
h2 { font-size: 18px; font-weight: 700; line-height: 1.3; margin: 0; }
h3 { font-size: 16px; font-weight: 700; margin: 0; }
.lede { color: var(--texto-secundario); max-width: 520px; }
.lema { font-size: 16px; font-weight: 600; color: var(--acento-claro); }
.panel { background: var(--tarjeta); border: 1px solid var(--borde-suave); border-radius: var(--r-contenedor); padding: var(--e24); display: grid; gap: var(--e16); min-width: 0; align-content: start; }

/* Botones con profundidad */
.btn { font-family: inherit; font-size: 16px; font-weight: 600; line-height: 1.25; min-height: 44px; padding: 0 var(--e24); border-radius: var(--r-control); border: 1px solid var(--borde-control); background: transparent; color: var(--texto); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: var(--e8); box-shadow: 0 4px 0 0 var(--borde-suave); transition: transform .08s ease, box-shadow .08s ease, background-color .08s ease; }
.btn:hover:not(:disabled) { background: var(--tarjeta); }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: none; }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn-primary { background: var(--acento); color: var(--fondo); border-color: var(--acento); box-shadow: 0 4px 0 0 var(--acento-oscuro); }
.btn-primary:hover:not(:disabled) { background: var(--acento-claro); border-color: var(--acento-claro); }
.btn-danger { color: var(--err-titulo); }
.btn:disabled { background: transparent; color: var(--bloqueado); border: 1px dashed var(--borde-control); box-shadow: none; cursor: not-allowed; }
.acciones { display: flex; flex-wrap: wrap; gap: var(--e12); align-items: center; justify-content: space-between; }
.fila { display: flex; flex-wrap: wrap; gap: var(--e12); align-items: center; }
.msg { color: var(--err-titulo); min-height: 1.5em; font-size: 14px; }
.nota { color: var(--texto-secundario); font-size: 14px; }
.input, select.input, textarea.input { font-family: inherit; font-size: 16px; min-height: 44px; padding: 0 var(--e16); border-radius: var(--r-control); border: 1px solid var(--borde-control); background: transparent; color: var(--texto); width: 100%; }
select.input { background: var(--fondo); }
textarea.input { min-height: 120px; padding: var(--e12) var(--e16); resize: vertical; line-height: 1.5; }
.input:hover, .input:focus { border-color: var(--acento); }
.input::placeholder { color: var(--texto-secundario); }
.input[aria-invalid="true"] { border-color: var(--err-borde); }

/* Inicio */
.avatares { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--e8); border: 0; padding: 0; margin: 0; }
.avatares legend { font-size: 14px; font-weight: 600; margin-bottom: var(--e8); padding: 0; }
.av-op { position: relative; display: grid; place-items: center; gap: 4px; border: 1px solid var(--borde-suave); border-radius: var(--r-control); padding: var(--e8) var(--e4); cursor: pointer; font-size: 13px; font-weight: 500; color: var(--texto-secundario); }
.av-op:has(input:checked) { color: var(--acento-claro); }
@media (max-width: 520px) { .avatares { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.av-op:hover { background: var(--bloque); }
.av-op input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.av-op:has(input:checked) { border: 2px solid var(--acento); background: var(--acento-oscuro); }
.av-op:has(input:focus-visible) { outline: 2px solid var(--acento); outline-offset: 2px; }

/* Sala */
.gente { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--e8); }
@media (min-width: 1024px) { .gente { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.gente li { display: flex; align-items: center; gap: var(--e8); border: 1px solid var(--borde-suave); border-radius: var(--r-control); padding: var(--e8) var(--e12); min-width: 0; font-weight: 600; }
.gente li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gente li.es-yo { border-color: var(--acento); }

/* Ejercicio */
.ej-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: var(--e12); }
.timer { display: inline-flex; align-items: center; gap: var(--e8); font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; border: 2px solid var(--borde-control); background: var(--bloque); color: var(--texto); border-radius: var(--r-pildora); padding: var(--e4) var(--e16); }
.timer svg { width: 18px; height: 18px; }
.timer.poco { border-color: var(--err-borde); background: var(--err-fondo); color: var(--err-titulo); }
.progreso { display: grid; gap: var(--e8); }
.progreso .rotulo { display: flex; justify-content: space-between; gap: var(--e12); font-size: 14px; font-weight: 600; }
.progreso .riel { height: 16px; border-radius: var(--r-pildora); background: var(--borde-suave); overflow: hidden; }
.progreso .lleno { height: 100%; border-radius: var(--r-pildora); background: var(--acento); }
.enlace-ext { display: inline-flex; align-items: center; gap: 4px; color: var(--acento-claro); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.enlace-ext svg { width: 16px; height: 16px; }
.pregunta { background: var(--bloque); border: 1px solid var(--borde-suave); border-radius: var(--r-contenedor); padding: var(--e16) var(--e24); font-size: 16px; }
@media (min-width: 1024px) { .ej-grid.op-fijas > .panel:first-child { position: sticky; top: 16px; align-self: start; max-height: calc(100vh - 32px); overflow-y: auto; } }
.hallazgos { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--e12); }
.hallazgo { border: 1px solid var(--borde-suave); border-radius: var(--r-contenedor); padding: var(--e12) var(--e16) var(--e16); margin: 0; display: grid; gap: var(--e12); min-width: 0; }
.hallazgo legend { font-size: 14px; font-weight: 700; padding: 0 4px; }
.hallazgo-fila { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--e12); }
@media (max-width: 599px) { .hallazgo-fila { grid-template-columns: minmax(0, 1fr); } }
.hallazgo textarea.input { min-height: 64px; }
.btn-quitar { justify-self: start; min-height: 44px; font-size: 14px; padding: 0 var(--e16); }
.lienzo { background: var(--lienzo); color: var(--lienzo-texto); border: 1px solid var(--borde-suave); border-radius: var(--r-contenedor); padding: var(--e16); overflow-x: auto; color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
#opc { display: grid; gap: var(--e24); }
.grupo { display: grid; gap: var(--e12); }
.grupo + .grupo { border-top: 1px solid var(--borde-suave); padding-top: var(--e24); }
.q { border: 0; padding: 0; margin: 0; display: grid; gap: var(--e8); min-width: 0; }
.q legend { font-size: 14px; font-weight: 600; padding: 0; margin-bottom: var(--e8); }
/* Opciones: tarjetas con profundidad */
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: var(--e12); }
.chip { position: relative; cursor: pointer; display: block; }
.chip input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.chip > span { overflow-wrap: anywhere; display: flex; align-items: center; gap: var(--e8); min-height: 48px; height: 100%; padding: var(--e8) var(--e12); border: 2px solid var(--borde-control); border-radius: var(--r-control); background: transparent; color: var(--texto); font-size: 14px; font-weight: 600; box-shadow: 0 4px 0 0 var(--borde-suave); transition: transform .08s ease, box-shadow .08s ease; }
.chip:hover > span { background: var(--bloque); }
.chip:active > span { transform: translateY(4px); box-shadow: none; }
.chip input:checked + span { border-color: var(--acento); background: var(--acento-oscuro); color: var(--acento-claro); box-shadow: 0 4px 0 0 var(--acento); }
.chip input:focus-visible + span { outline: 2px solid var(--acento); outline-offset: 2px; }
.sw { width: 20px; height: 20px; border-radius: 4px; border: 1px solid rgba(255,255,255,.35); display: inline-block; flex: none; }
.chip-sw > span { font-variant-numeric: tabular-nums; }
/* Botón alternar */
.tog { font-family: inherit; font-size: 14px; font-weight: 600; min-height: 36px; padding: 0 var(--e12); border: 1px solid var(--borde-control); background: transparent; color: var(--texto); border-radius: var(--r-control); cursor: pointer; }
.tog:hover { background: var(--bloque); }
.tog[aria-pressed="true"] { border: 2px solid var(--acento); background: var(--acento-oscuro); color: var(--acento-claro); }
.el-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--e12); border: 1px solid var(--borde-suave); border-radius: var(--r-control); padding: var(--e8) var(--e12); }
.el-row.on { border-color: var(--acento); }
/* Pestañas (estados del botón) */
.tabs { display: flex; border-bottom: 1px solid var(--borde-suave); }
.tabs .tog { min-height: 48px; padding: 0 var(--e16); font-size: 16px; border: 0; border-bottom: 3px solid transparent; border-radius: 0; color: var(--texto-secundario); background: transparent; }
.tabs .tog:hover { background: var(--tarjeta); }
.tabs .tog[aria-pressed="true"] { border: 0; border-bottom: 3px solid var(--acento); background: transparent; color: var(--texto); font-weight: 700; }
/* Muestras de color */
.swgrid { display: flex; flex-wrap: wrap; gap: var(--e4); }
.swop { position: relative; cursor: pointer; }
.swop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.swop > span { display: block; width: 32px; height: 32px; border-radius: var(--r-control); border: 1px solid var(--borde-suave); }
.swop > span.none { background: repeating-linear-gradient(45deg, var(--tarjeta) 0 4px, var(--borde-suave) 4px 8px); }
.swop input:checked + span { box-shadow: 0 0 0 2px var(--fondo), 0 0 0 4px var(--texto); }
.swop input:focus-visible + span { outline: 2px solid var(--acento); outline-offset: 4px; }
.elegido { font-size: 13px; color: var(--texto-secundario); font-variant-numeric: tabular-nums; }
.ej-pie .btn { width: 100%; }

/* Resultado */
.franja { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--e16); padding: var(--e16) var(--e24); border-radius: var(--r-contenedor); border: 2px solid; }
.franja.acierto { background: var(--acento-oscuro); border-color: var(--acento); }
.franja.error { background: var(--err-fondo); border-color: var(--err-borde); }
.franja-texto { display: flex; align-items: center; gap: var(--e12); }
.franja-icono { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: var(--r-pildora); color: var(--fondo); }
.franja.acierto .franja-icono { background: var(--acento); } .franja.error .franja-icono { background: var(--err-titulo); }
.franja-titulo { font-size: 18px; font-weight: 700; line-height: 1.3; }
.franja.acierto .franja-titulo { color: var(--acento-claro); } .franja.error .franja-titulo { color: var(--err-titulo); }
.franja-detalle { color: var(--texto); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--e12); }
.stat { background: var(--tarjeta); border: 1px solid var(--borde-suave); border-radius: var(--r-contenedor); padding: var(--e16); display: grid; gap: var(--e4); }
.stat.dest { border: 2px solid var(--acento); background: var(--acento-oscuro); }
.stat .k { font-size: 13px; font-weight: 500; color: var(--texto-secundario); }
.stat.dest .k { color: var(--acento-claro); }
.stat .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tabla-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: var(--e12); border-bottom: 1px solid var(--borde-suave); vertical-align: top; }
th { font-size: 13px; color: var(--texto-secundario); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.res { display: inline-flex; align-items: center; gap: var(--e4); font-weight: 600; white-space: nowrap; }
.res.si { color: var(--acento-claro); } .res.no { color: var(--err-titulo); } .res.neutro { color: var(--texto-secundario); }

/* Final y ranking */
.podio { display: flex; justify-content: center; align-items: flex-end; gap: var(--e12); flex-wrap: wrap; }
.podio .pos { display: grid; justify-items: center; gap: var(--e8); width: 150px; }
.podio .base { width: 100%; border: 1px solid var(--borde-suave); background: var(--tarjeta); border-radius: var(--r-contenedor) var(--r-contenedor) 0 0; display: grid; place-items: center; text-align: center; padding: var(--e8); }
.podio .p1 .base { height: 150px; border: 2px solid var(--acento); background: var(--acento-oscuro); color: var(--acento-claro); }
.podio .p2 .base { height: 110px; } .podio .p3 .base { height: 80px; }
.podio .nombre { font-weight: 700; overflow-wrap: anywhere; }
.recos { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--e12); }
@media (min-width: 600px) { .recos { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1024px) { .recos { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.reco { border: 1px solid var(--borde-suave); border-radius: var(--r-control); padding: var(--e12) var(--e16); display: flex; justify-content: space-between; gap: var(--e12); align-items: center; }
.reco .k { color: var(--texto-secundario); }
.etapas { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 600px) { .etapas { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; } }
@media (min-width: 1024px) { .etapas { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.etapa { border: 1px solid var(--borde-suave); background: var(--tarjeta); border-radius: var(--r-contenedor); padding: var(--e12) var(--e16); display: grid; gap: var(--e4); }
.etapa.activa { border: 2px solid var(--acento); background: var(--acento-oscuro); }
.etapa .estado { color: var(--texto-secundario); font-size: 14px; }
.etapa.activa .estado { color: var(--acento-claro); }
.aviso-conexion { background: var(--adv-fondo); color: var(--texto); border: 1px solid var(--adv-borde); border-radius: var(--r-contenedor); padding: var(--e12) var(--e16); }
details { border: 1px solid var(--borde-suave); border-radius: var(--r-control); padding: var(--e8) var(--e12); }
details summary { cursor: pointer; font-weight: 600; }
.copiable { font-variant-numeric: tabular-nums; overflow-wrap: anywhere; background: var(--bloque); border: 1px solid var(--borde-suave); border-radius: var(--r-control); padding: var(--e8) var(--e12); }
.proto-bar { border: 2px dashed var(--adv-borde); background: var(--adv-fondo); border-radius: var(--r-contenedor); padding: var(--e12) var(--e16); display: flex; flex-wrap: wrap; gap: var(--e12); align-items: center; }
.proto-bar b { font-size: 13px; font-weight: 700; color: var(--adv-titulo); }
.proto-bar select { width: auto; min-width: 0; max-width: 100%; flex: 1 1 260px; }

/* Lienzos: siempre en claro, porque los contrastes se miden contra blanco */
.lz-stack { display: grid; gap: 14px; }
.lz-label { font-size: 12px; color: #55606E; font-family: var(--font-mono); }
.lz-row { display: grid; gap: 6px; }
.lz-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.lz-op { border: 1px dashed #CDD5DF; border-radius: 10px; padding: 12px; display: grid; gap: 8px; align-content: start; min-width: 0; }

.mat-noticia-promo { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px; border-radius: 12px; background: #FFF6EC; flex-wrap: wrap; }
.mat-noticia-boletin { display: grid; gap: 8px; padding: 16px; border: 1px solid #E4E7EB; border-radius: 12px; }
.mat-noticia-form { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 4px; }

.lienzo { font-family: Inter, "Helvetica Neue", Helvetica, sans-serif; --material-texto-secundario: #55606E; --material-borde: #767676; --material-linea: #CDD5DF; --material-accion: #0E6A6A; --material-accion-hover: #0B5555; --material-accion-presionado: #083F3F; --material-enlace: #0057B8; --material-deshabilitado-fondo: #F5F5F5; --material-deshabilitado-texto: #707070; --material-advertencia-fondo: #FCEFD6; --material-advertencia: #8A5300; --material-error-fondo: #FBE3E1; --material-error: #B3261E; --material-exito-fondo: #DDF2E5; --material-exito: #1A7340; --material-profundidad-principal: 0 4px 0 0 rgba(0, 0, 0, 0.35); --material-profundidad-secundaria: 0 4px 0 0 #cdd5df; }
/* ===== Material de ejercicios: dentro de .lab-lienzo =====
   Mismos patrones que la plataforma (Inter, alto de 44 px, radio 8 y 12, profundidad de 4 px, borde punteado al desactivar), en versión clara
   porque el lienzo es blanco: los contrastes de los ejercicios se miden contra #FFFFFF. */
.lienzo .mat-raiz { font-family: var(--font-sans, Inter, "Helvetica Neue", Helvetica, sans-serif); color: var(--lienzo-texto); font-size: 14px; line-height: 1.5; }
.lienzo :focus-visible { outline: 2px solid var(--material-accion); outline-offset: 2px; }
.mat-rotulo { font-size: 13px; font-weight: 500; color: var(--material-texto-secundario); }
/* Botón (igual que Boton) */
.mat-btn { font-family: inherit; font-size: 16px; font-weight: 600; line-height: 1.25; min-height: 44px; padding: 0 24px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 8px; border: 1px solid transparent; background: var(--material-accion); color: #FFFFFF; box-shadow: var(--material-profundidad-principal); cursor: pointer; transition: transform .08s ease, box-shadow .08s ease; }
.mat-btn svg { width: 20px; height: 20px; flex: none; }
.mat-btn:hover, .mat-btn.is-hover { background: var(--material-accion-hover); }
.mat-btn:active, .mat-btn.is-active { transform: translateY(4px); box-shadow: none; }
.mat-btn--secundario, .mat-btn--icono { background: var(--lienzo); color: var(--lienzo-texto); border-color: var(--material-borde); box-shadow: var(--material-profundidad-secundaria); }
.mat-btn--secundario:hover, .mat-btn--secundario.is-hover, .mat-btn--icono:hover, .mat-btn--icono.is-hover { background: #F3F4F6; }
.mat-btn--icono { width: 44px; padding: 0; }
.mat-btn[aria-pressed="true"] { border: 2px solid var(--material-accion); background: #E3F1F1; color: var(--material-accion-presionado); box-shadow: 0 4px 0 0 var(--material-accion); }
.mat-btn:disabled { background: transparent; color: var(--material-deshabilitado-texto); border: 1px dashed var(--material-borde); box-shadow: none; transform: none; cursor: not-allowed; }
/* Tag (igual que Etiqueta) */
.mat-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 500; line-height: 1.25; padding: 4px 8px; border-radius: 999px; border: 1px solid currentColor; background: var(--material-exito-fondo); color: var(--material-exito); }
.mat-tag--neutra { background: #F3F4F6; color: var(--lienzo-texto); border-color: var(--material-linea); }
.mat-tag--advertencia { background: var(--material-advertencia-fondo); color: var(--material-advertencia); }
/* Tooltip: burbuja sobre el ícono que la abre (hover o foco). --tooltip-fondo permite cambiar el color en los ejercicios. */
.mat-tip { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
.mat-tip-ancla { position: relative; display: inline-flex; }
.mat-tooltip { --tooltip-fondo: var(--lienzo-texto); position: absolute; left: 0; bottom: calc(100% + 12px); z-index: 2; width: max-content; max-width: 240px; background: var(--tooltip-fondo); color: #FFFFFF; font-size: 13px; font-weight: 500; line-height: 1.35; padding: 8px 12px; border-radius: 8px; }
.mat-tooltip::after { content: ""; position: absolute; left: 16px; top: 100%; border: 6px solid transparent; border-top-color: var(--tooltip-fondo); }
.mat-tip-ancla:not(.is-abierto) .mat-tooltip { display: none; }
.mat-tip-ancla:hover .mat-tooltip, .mat-tip-ancla:focus-within .mat-tooltip { display: block; }
/* Cita */
.mat-cita { margin: 0; position: relative; padding: 16px 16px 16px 56px; border-radius: 12px; border: 1px solid var(--material-linea); background: #F3F4F6; color: var(--material-texto-secundario); }
.mat-cita::before { content: "\201C"; position: absolute; left: 16px; top: 8px; font: 700 52px/1 Georgia, "Times New Roman", serif; color: currentColor; }
.mat-cita blockquote { margin: 0; font-size: 16px; font-style: italic; line-height: 1.45; }
.mat-cita figcaption { margin-top: 8px; font-size: 14px; }
/* Card (igual que Tarjeta; la seleccionable, igual que BotonOpcion) */
.mat-card { border-radius: 12px; border: 1px solid var(--material-linea); background: var(--lienzo); padding: 16px; display: grid; gap: 4px; font-size: 14px; }
.mat-card b { font-size: 16px; font-weight: 700; }
.mat-card--sombra { border-color: transparent; box-shadow: 0 6px 16px rgba(0, 0, 0, .18); }
.mat-card--seleccionable { border: 2px solid var(--material-borde); box-shadow: var(--material-profundidad-secundaria); cursor: pointer; }
.mat-card--seleccionable[aria-checked="true"] { border-color: var(--material-accion); background: #E3F1F1; box-shadow: 0 4px 0 0 var(--material-accion); }
.mat-card--deshabilitada { background: var(--material-deshabilitado-fondo); color: var(--material-deshabilitado-texto); border: 1px dashed var(--material-borde); }

.mat-campo label { font-size: 14px; font-weight: 600; }
.mat-campo input { font-family: inherit; font-size: 16px; line-height: 1.25; min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--material-borde); background: var(--lienzo); color: var(--lienzo-texto); width: 100%; }
.mat-campo input::placeholder { color: var(--material-texto-secundario); }
.mat-campo input:hover, .mat-campo input.is-hover, .mat-campo input:focus, .mat-campo input.is-focus { border-color: var(--material-accion); }
.mat-campo input:disabled { background: transparent; color: var(--material-deshabilitado-texto); border-style: dashed; }
.mat-campo--error input { border-color: var(--material-error); }
.mat-campo .obligatorio { color: var(--material-error); }
.mat-campo .error { display: flex; gap: 8px; align-items: flex-start; color: var(--material-error); font-size: 14px; }
.mat-campo .error svg { width: 18px; height: 18px; flex: none; margin-top: 2px; }
/* Controles */
.mat-check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
.mat-check .caja { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--material-borde); display: grid; place-items: center; background: var(--lienzo); }
.mat-check[aria-checked="true"] .caja { background: var(--material-accion); border-color: var(--material-accion); color: #FFFFFF; }
.mat-check[aria-disabled="true"] { color: var(--material-deshabilitado-texto); } .mat-check[aria-disabled="true"] .caja { border-style: dashed; background: transparent; }
.mat-toggle { display: inline-flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
button.mat-toggle { background: none; border: 0; padding: 0; font-family: inherit; color: inherit; text-align: left; min-height: 44px; }
.mat-toggle .riel { width: 52px; height: 32px; border-radius: 999px; background: var(--material-borde); position: relative; flex: none; }
.mat-toggle .riel::after { content: ""; position: absolute; left: 4px; top: 4px; width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; transition: left .12s ease; }
.mat-toggle[aria-checked="true"] .riel { background: var(--material-accion); } .mat-toggle[aria-checked="true"] .riel::after { left: 24px; }
.mat-toggle[aria-disabled="true"] { color: var(--material-deshabilitado-texto); } .mat-toggle[aria-disabled="true"] .riel { background: transparent; border: 1px dashed var(--material-borde); }
/* Acordeón */
.mat-acordeon { border: 1px solid var(--material-linea); border-radius: 12px; }
.mat-acordeon .cabecera { display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 48px; padding: 12px 16px; font: inherit; font-size: 16px; font-weight: 700; background: none; border: 0; color: inherit; cursor: pointer; }
.mat-acordeon .cabecera svg { width: 20px; height: 20px; transition: transform .15s; }
.mat-acordeon .cabecera[aria-expanded="true"] svg { transform: rotate(180deg); }
.mat-acordeon .panel { padding: 0 16px 16px; color: var(--material-texto-secundario); background: none; border: 0; border-radius: 0; display: block; }
/* Alerta (igual que Alerta) */
.mat-alerta { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: 12px; border: 1px solid; font-size: 14px; }
.mat-alerta > svg { width: 20px; height: 20px; flex: none; margin-top: 1px; }
.mat-alerta .texto { flex: 1; }
.mat-alerta--advertencia { background: var(--material-advertencia-fondo); border-color: var(--material-advertencia); } .mat-alerta--advertencia > svg { color: var(--material-advertencia); }
.mat-alerta--error { background: var(--material-error-fondo); border-color: var(--material-error); } .mat-alerta--error > svg { color: var(--material-error); }
.mat-alerta--exito { background: var(--material-exito-fondo); border-color: var(--material-exito); } .mat-alerta--exito > svg { color: var(--material-exito); }
.mat-alerta .cerrar { background: none; border: 0; padding: 2px; color: var(--lienzo-texto); cursor: pointer; display: grid; } .mat-alerta .cerrar svg { width: 18px; height: 18px; }
/* Selector y enlace */
.mat-selector { display: grid; gap: 8px; position: relative; max-width: 320px; }
.mat-selector label { font-size: 14px; font-weight: 600; }
.mat-selector select { appearance: none; font-family: inherit; font-size: 16px; min-height: 44px; padding: 0 44px 0 16px; border-radius: 8px; border: 1px solid var(--material-borde); background: var(--lienzo); color: var(--lienzo-texto); }
.mat-selector .flecha { position: absolute; right: 12px; bottom: 12px; pointer-events: none; width: 20px; height: 20px; }
.mat-enlace { color: var(--material-enlace); text-decoration: underline; display: inline-flex; align-items: center; gap: 4px; }
.mat-enlace svg { width: 16px; height: 16px; }
@media (prefers-reduced-motion: reduce) { .mat-btn, .mat-toggle .riel::after { transition: none; } .mat-btn:active { transform: none; } }
/* ¿Se ve o no se ve?: A y B lado a lado */
.c2-par { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
.c2-version { display: grid; gap: 12px; align-content: start; border: 1px dashed #CDD5DF; border-radius: 10px; padding: 12px 12px 14px; }
.c2-letra { font: 700 14px/1 var(--font-mono); color: var(--lienzo-texto); }
.c2-comp { min-height: 110px; display: grid; place-items: center; padding: 8px; }
/* Tarjeta de opción del sistema de diseño (BotonOpcion) con radio nativo */
.opciones { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--e12); }
.opcion { position: relative; display: block; cursor: pointer; }
.opcion input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.opcion > span { display: flex; align-items: center; gap: var(--e12); min-height: 56px; height: 100%; padding: var(--e12) var(--e16); border: 2px solid var(--borde-control); border-radius: var(--r-control); color: var(--texto); font-size: 14px; font-weight: 600; box-shadow: 0 4px 0 0 var(--borde-suave); transition: transform .08s ease, box-shadow .08s ease; }
.opcion .tecla { flex: none; display: inline-grid; place-items: center; min-width: 28px; height: 28px; padding: 0 4px; border: 1px solid var(--borde-control); border-radius: var(--r-control); font-size: 13px; font-weight: 500; color: var(--texto-secundario); }
.opcion:hover > span { background: var(--tarjeta); }
.opcion:active > span { transform: translateY(4px); box-shadow: none; }
.opcion input:checked + span { border-color: var(--acento); background: var(--acento-oscuro); color: var(--acento-claro); box-shadow: 0 4px 0 0 var(--acento); }

.opcion input:focus-visible + span { outline: 2px solid var(--acento); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .opcion > span { transition: none; } .opcion:active > span { transform: none; } }

.hex:hover { background: var(--bloque); border-color: var(--acento); }
.hex.copiado { border-color: var(--acento); background: var(--acento-oscuro); color: var(--acento-claro); }
.lienzo .hex { border-color: #767676; background: #FFFFFF; color: #16202B; }

.lienzo .hex.copiado { border-color: #1A7340; background: #DDF2E5; color: #1A7340; }
.c1-medir { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid #CDD5DF; }
/* Pasos respondidos */

.paso .hecho:empty { display: none; }
.paso[aria-current="step"] .hecho { color: var(--acento-claro); }
/* Confirmación antes de enviar con preguntas vacías (Confirmacion) */
.confirmacion { border-radius: var(--r-contenedor); border: 1px solid var(--borde-control); background: var(--bloque); padding: var(--e16); display: grid; gap: var(--e12); }
.confirmacion .titulo { font-size: 16px; font-weight: 700; }
.confirmacion .acciones { display: flex; flex-wrap: wrap; gap: var(--e8); }
/* Para llevar */
.llevar { display: flex; gap: var(--e16); align-items: flex-start; padding: var(--e16) var(--e24); border-radius: var(--r-contenedor); border: 1px solid var(--borde-suave); background: var(--tarjeta); }
.llevar-icono { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: var(--r-pildora); border: 2px solid var(--adv-borde); background: var(--adv-fondo); color: var(--adv-titulo); }
.llevar-titulo { font-size: 14px; font-weight: 700; color: var(--adv-titulo); }
.llevar p { font-size: 16px; max-width: 72ch; }

/* ¿Cómo se nombra cada componente? */
.opciones-3 { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.opciones-1 { grid-template-columns: minmax(0, 1fr); }
.opcion code.codigo { font-family: var(--font-mono); font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }
.t2-card { width: min(100%, 420px); margin: 24px auto; padding: 24px; display: grid; gap: 0; justify-items: start; }
.t2-cab { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.t2-card .t2-titulo { font-size: 20px; line-height: 1.3; margin-bottom: 8px; }
.t2-datos { display: grid; gap: 4px; margin-bottom: 16px; }
.t2-datos .mat-dato { min-height: 36px; }
.t2-el { position: relative; display: inline-flex; border-radius: 8px; outline: 2px dashed transparent; outline-offset: 4px; }
.t2-el.actual { outline-color: #0E6A6A; }
.t2-el > .badge { position: absolute; top: -12px; left: -12px; z-index: 3; box-shadow: 0 0 0 2px #FFFFFF; }
.mat-dato { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; justify-self: start; }
.mat-tag--icono { min-height: 32px; padding: 0 12px; }
.mat-tag--icono svg { display: block; width: 16px; height: 16px; }
.mat-btn--redondo { border-radius: 999px; }
.mat-btn--chico { width: 32px; min-height: 32px; }
.mat-tooltip--derecha { left: calc(100% + 12px); bottom: auto; top: 50%; transform: translateY(-50%); }
.mat-tooltip--derecha::after { left: auto; right: 100%; top: 50%; transform: translateY(-50%); border-top-color: transparent; border-right-color: var(--tooltip-fondo); }

/* Revisa el handoff */
.lienzo { --anotacion: #6B35A0; --anotacion-fondo: #F5EEFB; }
.t3-par { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 1100px) { .t3-par { grid-template-columns: minmax(0, 1fr); } }
.t3-pantalla { display: grid; gap: 12px; padding: 16px; border: 1px solid #CDD5DF; border-radius: 12px; font-size: 14px; }
.t3-dos { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }

/* ============ Datos compartidos (Firebase o modo demo) ============ */
function avisoConexion(t) { const el = $("#conexion"); el.textContent = t; el.hidden = !t; }
async function crearStore() {
  if (!DEMO) {
    try {
      const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app.js`);
      const fs = await import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-firestore.js`);
      const app = initializeApp(FIREBASE_CONFIG);
      const db = fs.getFirestore(app);
      const salaRef = fs.doc(db, "salas", SALA);
      const partCol = fs.collection(db, "salas", SALA, "participantes");
      const onErr = e => { console.error(e); avisoConexion("No se pudo conectar con la base de datos. Revisa tu conexión a internet y recarga la página."); };
      return {
        modo: "firebase",
        watchSala(cb) { return fs.onSnapshot(salaRef, s => { avisoConexion(""); cb(s.exists() ? s.data() : null); }, onErr); },
        async setSala(p) { await fs.setDoc(salaRef, p, { merge: true }); },
        watchParticipantes(cb) { return fs.onSnapshot(partCol, qs => { const a = []; qs.forEach(d => a.push({ id: d.id, ...d.data() })); cb(a); }, onErr); },
        async setParticipante(id, d) { await fs.setDoc(fs.doc(partCol, id), d, { merge: true }); },
        async borrarParticipantes() { const qs = await fs.getDocs(partCol); await Promise.all(qs.docs.map(d => fs.deleteDoc(d.ref))); }
      };
    } catch (e) {
      console.warn("Firebase no disponible; se usa el modo demo", e);
      avisoConexion("No se pudo cargar la base de datos. La plataforma funciona en modo demo: los datos solo se guardan en este navegador.");
    }
  }
  return crearStoreDemo();
}
function crearStoreDemo() {
  const KEY = "a11y-demo-" + SALA;
  const leer = () => lsGet(KEY) || { sala: null, part: {} };
  let mem = leer();
  const sS = [], sP = [];
  const lista = () => Object.entries(mem.part).map(([id, v]) => ({ id, ...v }));
  const emit = () => { sS.forEach(f => f(mem.sala)); sP.forEach(f => f(lista())); };
  const guardar = () => { lsSet(KEY, mem); emit(); };
  window.addEventListener("storage", e => { if (e.key === KEY) { mem = leer(); emit(); } });
  const merge = (a, b) => { const o = { ...(a || {}) }; for (const k in b) { const v = b[k]; o[k] = (v && typeof v === "object" && !Array.isArray(v) && o[k] && typeof o[k] === "object" && !Array.isArray(o[k])) ? merge(o[k], v) : v; } return o; };
  return {
    modo: "demo",
    watchSala(cb) { sS.push(cb); cb(mem.sala); },
    async setSala(p) { mem.sala = merge(mem.sala, p); guardar(); },
    watchParticipantes(cb) { sP.push(cb); cb(lista()); },
    async setParticipante(id, d) { mem.part[id] = merge(mem.part[id], d); guardar(); },
    async borrarParticipantes() { mem.part = {}; guardar(); }
  };
}

const multi = (name, legend, ops, vals) => `<fieldset class="q"><legend>${legend}</legend><div class="chips">${ops.map(o => `<label class="chip"><input type="checkbox" name="${name}" value="${esc(o.v)}"${(vals || []).includes(o.v) ? " checked" : ""}><span>${o.t}</span></label>`).join("")}</div></fieldset>`;
const selectQ = (name, label, ops, val) => `<div class="q"><label for="sel-${name}" style="font-weight:700">${label}</label><select class="input" id="sel-${name}" name="${name}"><option value="">Elige una opción</option>${ops.map(o => `<option value="${esc(o.v)}"${val === o.v ? " selected" : ""}>${esc(o.t)}</option>`).join("")}</select></div>`;

function evalPreguntas(pregs, st) {
  const filas = pregs.map(p => {
    const v = st[p.id];
    const vacio = v == null || v === "" || (Array.isArray(v) && !v.length);
    const ok = !vacio && (p.esOk ? p.esOk(v) : v === p.ok);
    return { item: p.item, tu: vacio ? "Sin respuesta" : (p.ver ? p.ver(v) : String(v)), correcta: p.explica, ok };

    <div class="franja ${ok ? "acierto" : "error"}"><div class="franja-texto"><span class="franja-icono" aria-hidden="true">${icon(ok ? "check" : "x", "currentColor", 24)}</span><div style="display:grid;gap:4px"><p class="franja-titulo">${tramo} ${def.id === "a1" ? "Errores encontrados" : "Aciertos"}: ${esc(r.aciertos)}</p><p class="franja-detalle">Sumaste ${dato.pts} ${dato.pts === 1 ? "punto" : "puntos"}${dato.bono ? `, incluidos ${dato.bono} de bono por rapidez` : ""}.</p></div></div><button class="btn btn-primary" type="button" id="b-siguiente">Siguiente${icon("flecha", "currentColor", 20)}</button></div>
    ${def.llevar ? `<div class="llevar"><span class="llevar-icono" aria-hidden="true">${icon("idea", "currentColor", 22)}</span><div style="display:grid;gap:4px"><h2 class="llevar-titulo">Para llevar</h2><p>${def.llevar}</p></div></div>` : ""}
    <div class="panel"><h2>${def.id === "a1" ? "Errores escondidos en la pantalla" : "Tus respuestas y las correctas"}</h2>${tablaFilas(r.filas)}</div></section>`;
  $("#b-siguiente").addEventListener("click", () => { const id = def.id; resultado = null; if (PROTO) { const i = PROTO_P.findIndex(x => x[0] === "ej:" + id); protoIr(PROTO_P[Math.min(PROTO_P.length - 1, i + 1)][0]); return; } actualizar(true); });
}
function vistaFinal() {
  const rk = ranking(), pos = rk.findIndex(p => p.id === yo.pid) + 1, me = rk.find(p => p.id === yo.pid) || { puntajes: misPuntajes() };
  const p = { puntajes: { ...(me.puntajes || {}), ...local.hechos } };
  const total = totalDe(p);
  const podio = sala && sala.ranking ? `<div class="panel t-3 d-3"><h2>Podio de la sesión</h2><ol style="margin:0;padding-left:1.2em">${rk.slice(0, 3).map(x => `<li><b>${esc(x.nombre)}</b> · ${x.total} puntos</li>`).join("")}</ol></div>` : "";
  V().innerHTML = `<section class="grilla">
    <div style="display:grid;gap:8px"><span class="eyebrow">Fin de la sesión</span><h1>Tu resultado final</h1></div>
    <div class="panel t-8 d-4" style="justify-items:center;text-align:center">${avatarSVG(yo.avatar, 56)}<b>${esc(yo.nombre)}</b>
      <span style="font-family:var(--font-display);font-weight:800;font-size:1.5rem">Puesto ${pos || "–"} de ${rk.length || 1}</span><span class="nota">${total} puntos · el puesto se actualiza mientras los demás terminan</span></div>
    <div class="panel ${podio ? "t-5 d-5" : "t-8 d-8"}"><h2>Puntaje por etapa</h2><div class="tabla-wrap"><table><thead><tr><th scope="col">Etapa</th><th scope="col" class="num">Puntos</th></tr></thead><tbody>${ETAPAS.map(e => `<tr><td>${e.nombre}</td><td class="num">${etapaPts(p, e.n)} de ${e.n === 4 ? 100 : 360}</td></tr>`).join("")}</tbody></table></div></div>
    ${podio}</section>`;
}

function claveVista() {
  if (!yo) return "inicio";
  if (resultado) return "resultado:" + resultado.def.id;
  if (sala && sala.ranking && hecho("a1")) return "final";
  const etapa = (sala && sala.etapa) || 0;
  if (etapa === 0) return "espera:0";
  const pend = ejDeEtapa(etapa).find(e => !hecho(e.id));
  if (pend) return "ej:" + pend.id;
  if (etapa === 4 || (sala && sala.ranking)) return "final";
  return "espera:" + etapa;
}
function actualizar(forzar) {
  pintarYo();
  if (PROTO) { if (protoVista === "espera") refrescarEspera(); return; }
  if (ES_FACILITADOR) { vistaFacilitador(); return; }
  if (yo && store && gente.length && !gente.find(p => p.id === yo.pid) && store.modo === "firebase" && !actualizar.reg) {
    // si la sala se reinició, la persona vuelve al inicio
  }
  const k = claveVista();
  if (k === vistaKey && !forzar) {
    if (k.startsWith("espera")) refrescarEspera();
    if (k === "final") vistaFinal();
    if (k.startsWith("ej:")) aplicarExtension();
    return;
  }
  if (k === vistaKey && forzar && k.startsWith("ej:")) return;
  vistaKey = k;
  if (ej && !k.startsWith("ej:")) { clearInterval(ej.timer); ej = null; }
  if (k === "inicio") vistaInicio();
  else if (k.startsWith("resultado")) vistaResultado();
  else if (k === "final") vistaFinal();
  else if (k.startsWith("ej:")) iniciarEjercicio(EJ.find(e => e.id === k.slice(3)));
  else {
    const n = +k.split(":")[1];
    if (n === 0) vistaEspera("Esperando el inicio", "El facilitador iniciará la sesión en unos momentos. Mientras tanto, mira quiénes ya entraron.");
    else { const sig = ETAPAS.find(e => e.n === n + 1); vistaEspera(`Terminaste ${ETAPAS.find(e => e.n === n).nombre}`, `Buen trabajo. Escucha la explicación del facilitador; la etapa ${sig ? sig.nombre : "siguiente"} empezará cuando la inicie.`); }
  }
  if (!k.startsWith("ej:")) enfocarTitulo();
}

/* ============ Vista del facilitador ============ */
let fac = { ok: ssGet("a11y-fac-" + SALA) === "1", proyeccion: false, confirmar: false };
const audTexto = a => ((a && a.hallazgos) || []).map(h => `${h.el} · ${AUD_EL[h.el - 1] || ""} → ${h.cr}${h.txt ? " → " + h.txt : ""}`);
const audLista = a => { const l = audTexto(a); return l.length ? `<ol style="margin:0;padding:8px 0 0 1.4em;display:grid;gap:4px">${l.map(x => `<li>${esc(x)}</li>`).join("")}</ol>` : '<p class="nota" style="padding-top:8px">Sin hallazgos.</p>'; };
function vistaFacilitador() {
  if (!fac.ok) {
    if ($("#f-clave")) return;
    V().innerHTML = `<section class="grilla"><div class="d-5" style="display:grid;gap:8px"><span class="eyebrow">Acceso del facilitador</span><h1>Panel del facilitador</h1><p class="lede">Escribe la clave del facilitador para controlar la sala ${esc(SALA)}.</p></div>
      <form class="panel d-7" id="f-clave" novalidate><div class="q"><label for="clave" style="font-weight:700">Clave</label><input class="input" id="clave" type="password" autocomplete="off" aria-describedby="clave-err"><p class="msg" id="clave-err"></p></div><button class="btn btn-primary" type="submit">Entrar</button></form></section>`;
    $("#f-clave").addEventListener("submit", e => { e.preventDefault(); if ($("#clave").value === CLAVE_FACILITADOR) { fac.ok = true; ssSet("a11y-fac-" + SALA, "1"); vistaKey = ""; vistaFacilitador(); enfocarTitulo(); } else { $("#clave-err").textContent = "La clave no es correcta. Inténtalo de nuevo."; $("#clave").focus(); } });
    return;
  }
  const foco = document.activeElement && document.activeElement.id;
  const etapa = (sala && sala.etapa) || 0, rk = ranking(), n = gente.length;
  if (fac.proyeccion) { vistaProyeccion(rk); if (foco && $("#" + foco)) $("#" + foco).focus(); return; }
  const sig = ETAPAS.find(e => e.n === etapa + 1);
  const enlace = location.origin + location.pathname + (SALA !== "sesion1" ? "?sala=" + SALA : "") + (DEMO ? (SALA !== "sesion1" ? "&" : "?") + "demo" : "");
  V().innerHTML = `<section style="display:grid;gap:20px">
    <div class="fila" style="justify-content:space-between"><div style="display:grid;gap:6px"><span class="eyebrow">Sala ${esc(SALA)} · ${store.modo === "firebase" ? "Conectado a Firebase" : "Modo demo (solo este navegador)"}</span><h1>Panel del facilitador</h1></div><span class="pill">${n} ${n === 1 ? "participante conectado" : "participantes conectados"}</span></div>
    <div class="panel"><h2>Enlace para los participantes</h2><div class="fila"><span class="copiable" id="enlace">${esc(enlace)}</span><button class="btn" type="button" id="b-copiar">Copiar enlace</button><span class="nota" id="copiado" aria-live="polite"></span></div></div>
    <div class="etapas">${ETAPAS.map(e => { const term = gente.filter(p => etapaTerminada(p, e.n)).length; const est = etapa > e.n ? `Terminada · ${term} de ${n} completaron` : etapa === e.n ? `En curso · ${term} de ${n} terminaron` : "Pendiente"; return `<div class="etapa${etapa === e.n ? " activa" : ""}"><b>${e.nombre}</b><span class="estado">${est}</span></div>`; }).join("")}</div>
    <div class="fila">
      <button class="btn btn-primary" type="button" id="b-iniciar"${sig ? "" : " disabled"}>${sig ? "Iniciar " + sig.nombre : "Todas las etapas iniciadas"}</button>
      <button class="btn" type="button" id="b-extender"${etapa ? "" : " disabled"}>Extender 1 minuto</button>
      <button class="btn" type="button" id="b-ranking">${sala && sala.ranking ? "Ver pantalla de ranking" : "Mostrar ranking"}</button>
      <button class="btn" type="button" id="b-csv">Descargar datos (CSV)</button>
      <button class="btn btn-danger" type="button" id="b-reset">Reiniciar sala</button>
    </div>
    <p class="nota" id="fac-msg" aria-live="polite"></p>
    <div class="panel" id="confirmar" ${fac.confirmar ? "" : "hidden"}><p><b>¿Reiniciar la sala?</b> Se borran todos los participantes y puntajes, y la sala vuelve a la espera. No se puede deshacer.</p><div class="fila"><button class="btn btn-danger" type="button" id="b-reset-si">Sí, borrar todo</button><button class="btn" type="button" id="b-reset-no">Cancelar</button></div></div>
    <div class="panel"><h2>Ranking completo</h2>${rk.length ? `<div class="tabla-wrap"><table><thead><tr><th scope="col" class="num">Puesto</th><th scope="col">Participante</th>${ETAPAS.map(e => `<th scope="col" class="num">${e.nombre}</th>`).join("")}<th scope="col" class="num">Ejercicios</th><th scope="col" class="num">Total</th></tr></thead><tbody>${rk.map((p, i) => `<tr><td class="num">${i + 1}</td><td><span class="fila" style="gap:8px">${avatarSVG(p.avatar, 24)}${esc(p.nombre)}</span></td>${ETAPAS.map(e => `<td class="num">${etapaPts(p, e.n)}</td>`).join("")}<td class="num">${Object.keys(p.puntajes || {}).length} de ${EJ.length}</td><td class="num"><b>${p.total}</b></td></tr>`).join("")}</tbody></table></div>` : '<p class="nota">Todavía no hay participantes en la sala.</p>'}</div>
    <div class="panel"><h2>Respuestas de la Auditoría express</h2>${gente.filter(p => p.auditoria).length ? gente.filter(p => p.auditoria).map(p => `<details><summary>${esc(p.nombre)} · ${(p.puntajes || {}).a1?.aciertos || ""}</summary>${audLista(p.auditoria)}</details>`).join("") : '<p class="nota">Aparecen cuando los participantes envían la auditoría.</p>'}</div>
  </section>`;
  $("#b-copiar").addEventListener("click", async () => { try { await navigator.clipboard.writeText(enlace); $("#copiado").textContent = "Enlace copiado."; } catch (e) { const r = document.createRange(); r.selectNodeContents($("#enlace")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $("#copiado").textContent = "Selecciona y copia el enlace."; } });
  $("#b-iniciar").addEventListener("click", async () => { if (!sig) return; await store.setSala({ etapa: sig.n, ["inicio" + sig.n]: Date.now() }); $("#fac-msg").textContent = `Iniciaste ${sig.nombre}.`; });
  $("#b-extender").addEventListener("click", async () => { await store.setSala({ extension: ((sala && sala.extension) || 0) + 1 }); $("#fac-msg").textContent = "Agregaste 1 minuto a quienes están resolviendo un ejercicio."; });
  $("#b-ranking").addEventListener("click", async () => { if (!(sala && sala.ranking)) await store.setSala({ ranking: true }); fac.proyeccion = true; vistaFacilitador(); enfocarTitulo(); });
  $("#b-csv").addEventListener("click", descargarCSV);
  $("#b-reset").addEventListener("click", () => { fac.confirmar = true; $("#confirmar").hidden = false; $("#b-reset-si").focus(); });
  $("#b-reset-no").addEventListener("click", () => { fac.confirmar = false; $("#confirmar").hidden = true; $("#b-reset").focus(); });
  $("#b-reset-si").addEventListener("click", async () => { fac.confirmar = false; await store.borrarParticipantes(); await store.setSala({ etapa: 0, ranking: false, extension: 0 }); $("#fac-msg").textContent = "La sala se reinició."; });
  if (foco && $("#" + foco)) $("#" + foco).focus();
}
function reconocimientos(rk) {
  const out = [];
  [1, 2, 3].forEach(n => { const best = [...rk].filter(p => etapaPts(p, n) > 0).sort((a, b) => etapaPts(b, n) - etapaPts(a, n))[0]; if (best) out.push([`Mejor en ${ETAPAS[n - 1].nombre}`, best.nombre]); });
  const maxEj = Math.max(0, ...rk.map(p => Object.keys(p.puntajes || {}).length));
  const rap = rk.filter(p => maxEj && Object.keys(p.puntajes || {}).length === maxEj).sort((a, b) => a.t - b.t)[0];
  if (rap) out.push(["Más rápido", rap.nombre]);
  return out;
}
function vistaProyeccion(rk) {
  const pod = [rk[1], rk[0], rk[2]], cls = ["p2", "p1", "p3"], lugar = [2, 1, 3];
  V().innerHTML = `<section style="display:grid;gap:24px">
    <div class="fila" style="justify-content:space-between"><div style="display:grid;gap:6px"><span class="eyebrow">Fin de la sesión</span><h1>Ranking final</h1></div><button class="btn" type="button" id="b-volver">Volver al panel</button></div>
    <div class="podio">${pod.map((p, i) => p ? `<div class="pos ${cls[i]}">${avatarSVG(p.avatar, 48)}<span class="nombre">${esc(p.nombre)}</span><div class="base"><span><b style="font-size:1.6rem;font-family:var(--font-display)">${lugar[i]}°</b><br><span class="nota">${p.total} puntos</span></span></div></div>` : "").join("")}</div>
    ${rk.length > 3 ? `<div class="panel"><h2>También en el top 5</h2><ol start="4" style="margin:0;padding-left:1.4em;display:flex;gap:28px;flex-wrap:wrap">${rk.slice(3, 5).map(p => `<li><b>${esc(p.nombre)}</b> · ${p.total} puntos</li>`).join("")}</ol></div>` : ""}
    <div class="panel"><h2>Reconocimientos</h2><div class="recos">${reconocimientos(rk).map(([k, v]) => `<div class="reco"><span class="k">${k}</span><b>${esc(v)}</b></div>`).join("") || '<p class="nota">Aparecen cuando hay puntajes.</p>'}</div></div>
    <p class="nota" style="text-align:center">Cada persona ve su puesto y su puntaje en su propio dispositivo.</p></section>`;
  $("#b-volver").addEventListener("click", () => { fac.proyeccion = false; vistaFacilitador(); enfocarTitulo(); });
}
function descargarCSV() {
  const rk = ranking();
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const cab = ["Puesto", "Nombre", "Avatar", "Total", ...ETAPAS.map(e => e.nombre), ...EJ.flatMap(e => [`${e.titulo} · puntos`, `${e.titulo} · tiempo (s)`, `${e.titulo} · aciertos`, `${e.titulo} · respuestas`]), "Auditoría · hallazgos"];
  const filas = rk.map((p, i) => [i + 1, p.nombre, (AVATARES[p.avatar] || {}).nombre, p.total, ...ETAPAS.map(e => etapaPts(p, e.n)), ...EJ.flatMap(e => { const x = (p.puntajes || {})[e.id] || {}; return [x.pts ?? "", x.tiempo ?? "", x.aciertos ?? "", x.respuestas ?? ""]; }), audTexto(p.auditoria).join(" | ")]);
  const csv = "﻿" + [cab, ...filas].map(r => r.map(q).join(";")).join("\r\n");
  const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a"); a.href = url; a.download = `laboratorio-a11y-${SALA}-${new Date().toISOString().slice(0, 10)}.csv`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  const m = $("#fac-msg"); if (m) m.textContent = "Descargaste los datos de la sesión.";
}

/* ============ Prototipo ============ */
let protoVista = "";
const PROTO_P = [["inicio", "Inicio"], ["espera", "Sala de espera"], ...EJ.map(e => ["ej:" + e.id, `${ETAPAS.find(x => x.n === e.etapa).nombre} · ${e.titulo}`]), ["resultado", "Resultado de un ejercicio (ejemplo)"], ["final", "Tu resultado final"], ["facilitador", "Vista del facilitador"], ["ranking", "Ranking en pantalla grande"]];
function protoIr(k) {
  if (ej) { clearInterval(ej.timer); ej = null; }
  resultado = null; protoVista = k; $("#proto-sel").value = k;
  if (k === "inicio") vistaInicio();
  else if (k === "espera") vistaEspera("Esperando el inicio", "El facilitador iniciará la sesión en unos momentos. Mientras tanto, mira quiénes ya entraron.");
  else if (k.startsWith("ej:")) { const id = k.slice(3); delete yo.deadlines[id]; delete local.hechos[id]; iniciarEjercicio(EJ.find(e => e.id === id)); return; }
  else if (k === "resultado") { const def = EJ[0], r = def.evaluar({ ...def.init(), btn: "#BD5A00", card: "exento" }); resultado = { def, r, dato: { pts: r.puntos + 12, bono: 12 }, auto: false }; vistaResultado(); }
  else if (k === "final") { sala = { ...(sala || {}), ranking: true }; vistaFinal(); }
  else if (k === "facilitador") { fac.ok = true; fac.proyeccion = false; vistaFacilitador(); }
  else if (k === "ranking") { fac.proyeccion = true; vistaProyeccion(ranking()); }
  enfocarTitulo();
}
async function protoIniciar() {
  await store.borrarParticipantes();
  await store.setSala({ etapa: 1, ranking: true, extension: 0 });
  const muestra = ["Joan", "Ana", "Luis", "María", "Carlos", "Rosa", "Diego", "Lucía"];
  for (let i = 0; i < muestra.length; i++) {
    const puntajes = {};
    EJ.forEach((e, j) => { puntajes[e.id] = { pts: 40 + ((i * 37 + j * 23) % 75), tiempo: 120 + ((i * 41 + j * 17) % 170), aciertos: "Ejemplo", respuestas: "Datos de ejemplo" }; });
    await store.setParticipante("proto-" + i, { nombre: muestra[i], avatar: (i * 5) % 12, creado: i, puntajes, auditoria: { hallazgos: [{ el: "3", cr: "1.4.3", txt: "Oscurecer la bajada hasta 4.5:1" }, { el: "8", cr: "1.1.1", txt: "Describir la foto en el texto alternativo" }, { el: "14", cr: "3.3.2", txt: "Pasar (obligatorio) a la etiqueta" }].slice(0, 1 + i % 3) } });
  }
  yo = { pid: "proto-0", nombre: "Joan", avatar: 0, deadlines: {}, ext: {} };
  const sel = $("#proto-sel");
  sel.innerHTML = PROTO_P.map(([k, t]) => `<option value="${k}">${esc(t)}</option>`).join("");
  sel.addEventListener("change", () => protoIr(sel.value));
  const mover = d => { const i = PROTO_P.findIndex(x => x[0] === protoVista); protoIr(PROTO_P[Math.max(0, Math.min(PROTO_P.length - 1, i + d))][0]); };
  $("#proto-ant").addEventListener("click", () => mover(-1));
  $("#proto-sig").addEventListener("click", () => mover(1));
  $("#proto").hidden = false;
  avisoConexion("");
  protoIr("inicio");
}

/* ============ Arranque ============ */
(async function () {
  V().innerHTML = '<p class="nota">Cargando la sala…</p>';
  store = await crearStore();
  if (PROTO) { const refac = () => { if (protoVista === "facilitador" && !fac.proyeccion) vistaFacilitador(); }; store.watchSala(s => { sala = s || sala; refac(); }); store.watchParticipantes(a => { gente = a; actualizar(false); refac(); }); await protoIniciar(); return; }
  store.watchSala(s => {
    sala = s || { etapa: 0 };
    if (!s && ES_FACILITADOR && fac.ok) store.setSala({ etapa: 0, ranking: false, extension: 0, creada: Date.now() });
    actualizar(false);
  });
  store.watchParticipantes(a => {
    gente = a;
    // si la sala se reinició y mi registro ya no existe, vuelvo al inicio
    if (!ES_FACILITADOR && yo && gente.length >= 0 && store.modo && !gente.find(p => p.id === yo.pid) && actualizar.visto) { yo = null; try { localStorage.removeItem(LKEY); } catch (e) {} local.hechos = {}; resultado = null; vistaKey = ""; }
    if (yo && gente.find(p => p.id === yo.pid)) actualizar.visto = true;
    actualizar(false);
  });
})();
</script>
</body>
